			* {
				box-sizing: border-box;
			}
			body {
				margin: 0;
				background: #0f1419;
				font-family:
					"DM Sans",
					-apple-system,
					BlinkMacSystemFont,
					sans-serif;
				overflow: hidden;
				color: #e6edf3;
			}
			#app {
				position: relative;
				width: 100vw;
				height: 100vh;
			}
			svg {
				display: block;
				width: 100%;
				height: 100%;
				cursor: grab;
			}
			svg:active {
				cursor: grabbing;
			}
			.country {
				fill: #1c2128;
				stroke: #30363d;
				stroke-width: 0.3px;
				transition:
					fill 0.2s ease,
					stroke 0.2s ease,
					filter 0.2s ease;
			}
			.country:hover {
				filter: brightness(1.3);
			}
			.country.highlight {
				stroke: #58a6ff;
				stroke-width: 1.5px;
				filter: brightness(1.25);
			}
			#tooltip {
				position: fixed;
				pointer-events: none;
				background: rgba(22, 27, 34, 0.95);
				border: 1px solid #30363d;
				border-radius: 10px;
				padding: 12px 16px;
				font-size: 13px;
				max-width: 320px;
				box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
				opacity: 0;
				transition:
					opacity 0.15s ease,
					transform 0.15s ease;
				z-index: 100;
			}
			#tooltip.visible {
				opacity: 1;
			}
			#tooltip h3 {
				margin: 0 0 8px 0;
				font-size: 15px;
				color: #58a6ff;
			}
			#tooltip .cycles {
				color: #8b949e;
				margin-bottom: 4px;
			}
			#tooltip .languages {
				color: #7ee787;
				font-size: 12px;
			}
			#panel {
				position: fixed;
				top: 20px;
				right: 20px;
				width: 320px;
				max-height: calc(100vh - 40px);
				overflow-y: auto;
				background: rgba(22, 27, 34, 0.96);
				border: 1px solid #30363d;
				border-radius: 12px;
				padding: 20px;
				box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
				z-index: 50;
				opacity: 0;
				pointer-events: none;
				transition: opacity 0.2s ease;
			}
			#panel.visible {
				opacity: 1;
				pointer-events: auto;
			}
			#panel h2 {
				margin: 0 0 12px 0;
				font-size: 20px;
				color: #58a6ff;
			}
			#panel .meta {
				color: #8b949e;
				font-size: 13px;
				margin-bottom: 12px;
			}
			#panel .cycle-list {
				font-size: 13px;
				line-height: 1.6;
			}
			#panel .cycle-list span {
				display: inline-block;
				margin-right: 8px;
				margin-bottom: 4px;
				padding: 2px 8px;
				background: #21262d;
				border-radius: 6px;
			}
			#panel .close {
				margin-top: 16px;
				cursor: pointer;
				color: #58a6ff;
				font-size: 13px;
			}
			#panel .close:hover {
				text-decoration: underline;
			}
			#legend {
				position: fixed;
				bottom: 24px;
				left: 24px;
				background: rgba(22, 27, 34, 0.92);
				border: 1px solid #30363d;
				border-radius: 10px;
				padding: 14px 18px;
				z-index: 50;
			}
			#legend h4 {
				margin: 0 0 10px 0;
				font-size: 12px;
				color: #8b949e;
				text-transform: uppercase;
				letter-spacing: 0.05em;
			}
			#legend .scale {
				display: flex;
				align-items: center;
				gap: 8px;
				font-size: 11px;
				color: #8b949e;
			}
			#legend .scale div {
				width: 24px;
				height: 14px;
				border-radius: 4px;
			}
			#filter {
				position: fixed;
				top: 20px;
				left: 20px;
				display: flex;
				flex-wrap: wrap;
				gap: 8px;
				z-index: 50;
			}
			#filter button {
				padding: 8px 14px;
				border: 1px solid #30363d;
				border-radius: 8px;
				background: rgba(22, 27, 34, 0.9);
				color: #e6edf3;
				font-size: 12px;
				cursor: pointer;
				transition:
					background 0.2s,
					border-color 0.2s;
			}
			#filter button:hover {
				background: #21262d;
				border-color: #58a6ff;
			}
			#filter button.active {
				background: #238636;
				border-color: #2ea043;
			}
			#title {
				position: fixed;
				top: 20px;
				left: 50%;
				transform: translateX(-50%);
				font-size: 18px;
				font-weight: 600;
				color: #e6edf3;
				z-index: 40;
				pointer-events: none;
			}
		</style>
	</head>

					Benchmarker: "",
					"Participated P21 ": "X",
					"Participated P16": "X",
					"Participated P11": "X",
					"Participated P06": "X",
					"Participated P01": "X",
					"P26 Assessment Languages": "Arabic, English, Swedish",
				},
				{ Country: "Tajikistan", Benchmarker: "", "P26 Assessment Languages": "Russian, Tajik" },
				{
					Country: "United Arab Emirates",
					Benchmarker: "",
					"Participated P21 Delayed": "X",
					"Participated P16": "X",
					"Participated P11": "X",
					"Participated P06": "",
					"Participated P01": "",
					"P26 Assessment Languages": "Arabic, English",
				},
				{
					Country: "Abu Dhabi, UAE",
					Benchmarker: "X",
					"Participated P21 ": "X",
					"Participated P16": "X",
					"Participated P11": "X",
					"Participated P06": "",
					"Participated P01": "",
					"P26 Assessment Languages": "Arabic, English",
				},
				{
					Country: "Dubai, UAE",
					Benchmarker: "X",
					"Participated P21 ": "X",
					"Participated P16": "X",
					"Participated P11": "X",
					"Participated P06": "",
					"Participated P01": "",
					"P26 Assessment Languages": "Arabic, English",
				},
				{
					Country: "Sharjah, UAE",
					Benchmarker: "X",
					"Participated P21 ": "X",
					"Participated P16": "",
					"Participated P11": "",
					"Participated P06": "",
					"Participated P01": "",
					"P26 Assessment Languages": "Arabic, English",
				},
				{
					Country: "Uzbekistan",
					Benchmarker: "",
					"Participated P21 ": "X",
					"Participated P16": "",
					"Participated P11": "",
					"Participated P06": "",
					"Participated P01": "",
					"P26 Assessment Languages": "Karakalpak, Russian, Uzbek",
				},
				{ Country: "Wales", Benchmarker: "", "P26 Assessment Languages": "English, Welsh" },
			];

			// Map CSV country name -> GeoJSON id (ISO 3166-1 alpha-3)
			const COUNTRY_TO_ID = {
				Albania: "ALB",
				Australia: "AUS",
				Austria: "AUT",
				Azerbaijan: "AZE",
				Bahrain: "BHR",
				"Belgium (Flemish)": "BEL",
				"Belgium (French)": "BEL",
				Brazil: "BRA",
				Bulgaria: "BGR",
				Canada: "CAN",
				"Ontario, Canada": "CAN",
				"Quebec, Canada": "CAN",
				"Chinese Taipei": "TWN",
				Cyprus: "CYP",
				"Czech Republic": "CZE",
				Denmark: "DNK",
				England: "GBR",
				Finland: "FIN",
				France: "FRA",
				Georgia: "GEO",
				Germany: "DEU",
				"Hong Kong SAR": "HKG",
				Hungary: "HUN",
				"Iran, Islamic Rep. of": "IRN",
				Ireland: "IRL",
				Israel: "ISR",
				Italy: "ITA",
				Jordan: "JOR",
				Kazakhstan: "KAZ",
				"Korea, Rep. of": "KOR",
				Kuwait: "KWT",
				Latvia: "LVA",
				Lithuania: "LTU",
				"Macao SAR": "MAC",
				Malta: "MLT",
				Montenegro: "MNE",
				Morocco: "MAR",
				Netherlands: "NLD",
				"New Zealand": "NZL",
				"North Macedonia": "MKD",
				"Northern Ireland": "GBR",
				Norway: "NOR",
				Oman: "OMN",
				Poland: "POL",
				Portugal: "PRT",
				Qatar: "QAT",
				Romania: "ROU",
				"Saudi Arabia": "SAU",
				"Saudi Arabia (RCJY)": "SAU",
				"South Africa": "ZAF",
				Scotland: "GBR",
				Serbia: "SRB",
				Singapore: "SGP",
				"Slovak Republic": "SVK",
				Slovenia: "SVN",
				Spain: "ESP",
				Sweden: "SWE",
				Tajikistan: "TJK",
				"United Arab Emirates": "ARE",
				"Abu Dhabi, UAE": "ARE",
				"Dubai, UAE": "ARE",
				"Sharjah, UAE": "ARE",
				Uzbekistan: "UZB",
				Wales: "GBR",
			};

			const CYCLE_KEYS = [
				"Participated P21 ",
				"Participated P21 Delayed",
				"Participated P16",
				"Participated P11",
				"Participated P06",
				"Participated P01",
			];

			function parseRow(row) {
				const cycles = [];
				if (row["Participated P21 "] === "X") cycles.push("P21");
				if (row["Participated P21 Delayed"] === "X") cycles.push("P21 Delayed");
				if (row["Participated P16"] === "X") cycles.push("P16");
				if (row["Participated P11"] === "X") cycles.push("P11");
				if (row["Participated P06"] === "X") cycles.push("P06");
				if (row["Participated P01"] === "X") cycles.push("P01");
				return {
					country: row.Country,
					cycles,
					count: cycles.length,
					languages: (row["P26 Assessment Languages"] || "").trim(),
					benchmarker: row.Benchmarker === "X",
				};
			}

			// Aggregate by map id: max participation count and list of entities
			function aggregateByCountry(rows) {
				const byId = {};
				for (const row of rows) {
					const id = COUNTRY_TO_ID[row.Country];
					if (!id) continue;
					const parsed = parseRow(row);
					if (!byId[id]) {
						byId[id] = { count: 0, cycles: new Set(), entities: [], languages: parsed.languages };
					}
					byId[id].count = Math.max(byId[id].count, parsed.count);
					parsed.cycles.forEach((c) => byId[id].cycles.add(c));
					byId[id].entities.push({ name: row.Country, ...parsed });
				}
				return byId;
			}

			const countryData = aggregateByCountry(CSV_ROWS);
			const colorScale = d3.scaleSequential(d3.interpolateGreens).domain([0, 6]);

			const width = window.innerWidth;
			const height = window.innerHeight;
			const projection = d3
				.geoMercator()
				.scale(120)
				.translate([width / 2, height / 2.1]);
			const pathGenerator = d3.geoPath().projection(projection);

			const svg = d3.select("#app").append("svg").attr("width", width).attr("height", height);
			const g = svg.append("g");

			let currentFilter = "all";

			// Close panel when clicking map background (not on a country)
			svg.on("click", (e) => {
				if (e.target.tagName !== "path") document.getElementById("panel").classList.remove("visible");
			});
			let zoom = d3
				.zoom()
				.scaleExtent([1, 8])
				.on("zoom", (e) => g.attr("transform", e.transform));
			svg.call(zoom);

			function cycleMatch(data, filter) {
				if (filter === "all") return true;
				return data && data.cycles && data.cycles.has(filter);
			}

			function fillFor(d) {
				const data = countryData[d.id];
				if (!data) return "#161b22";
				if (!cycleMatch(data, currentFilter)) return "#161b22";
				return colorScale(Math.min(6, data.count));
			}

			function render(world) {
				const features = world.features.filter((d) => d.id !== "ATA"); // hide Antarctica for clarity
				g.selectAll("path")
					.data(features)
					.join("path")
					.attr("class", "country")
					.attr("d", pathGenerator)
					.attr("fill", (d) => fillFor(d))
					.attr("data-id", (d) => d.id)
					.on("mouseenter", (e, d) => {
						const data = countryData[d.id];
						d3.select(e.target).classed("highlight", true);
						const tooltip = document.getElementById("tooltip");
						tooltip.classList.add("visible");
						const name = d.properties?.name || d.id;
						let html = `<h3>${name}</h3>`;
						if (data) {
							const cycleList = [...data.cycles].sort().join(", ");
							html += `<div class="cycles">Cycles: ${cycleList || "—"}</div>`;
							html += `<div class="languages">${data.languages || ""}</div>`;
						} else {
							html += '<div class="cycles">No participation data</div>';
						}
						tooltip.innerHTML = html;
						tooltip.style.left = `${e.pageX + 14}px`;
						tooltip.style.top = `${e.pageY + 14}px`;
					})
					.on("mousemove", (e) => {
						document.getElementById("tooltip").style.left = `${e.pageX + 14}px`;
						document.getElementById("tooltip").style.top = `${e.pageY + 14}px`;
					})
					.on("mouseleave", (e) => {
						d3.select(e.target).classed("highlight", false);
						document.getElementById("tooltip").classList.remove("visible");
					})
					.on("click", (e, d) => {
						const data = countryData[d.id];
						const name = d.properties?.name || d.id;
						const panel = document.getElementById("panel");
						if (!data) {
							panel.innerHTML = `<h2>${name}</h2><div class="meta">No participation data in dataset.</div><div class="close">Close</div>`;
						} else {
							const cycleList = [...data.cycles]
								.sort()
								.map((c) => `<span>${c}</span>`)
								.join("");
							const entitiesList = data.entities.map((e) => e.name).join(", ");
							panel.innerHTML = `
								<h2>${name}</h2>
								<div class="meta">Entities: ${entitiesList}</div>
								<div class="cycle-list">${cycleList}</div>
								<div class="meta" style="margin-top:12px">Languages: ${data.languages}</div>
								<div class="close">Close</div>
							`;
						}
						panel.classList.add("visible");
						panel.querySelector(".close").onclick = () => panel.classList.remove("visible");
					});
			}

			// Load world GeoJSON
			d3.json("https://cdn.jsdelivr.net/gh/holtzy/D3-graph-gallery@master/DATA/world.geojson")
				.then((world) => {
					render(world);
				})
				.catch(() => {
					// Fallback: fetch from raw GitHub (may have CORS in some environments)
					return d3
						.json("https://raw.githubusercontent.com/holtzy/D3-graph-gallery/master/DATA/world.geojson")
						.then(render);
				})
				.catch((err) => {
					document.getElementById("app").innerHTML =
						"<p style='padding:40px;text-align:center'>Could not load map data. Open this page via a local server (e.g. <code>npx serve .</code>) or check network.</p>";
				});

			// Filter buttons
			document.querySelectorAll("#filter button").forEach((btn) => {
				btn.addEventListener("click", () => {
					document.querySelectorAll("#filter button").forEach((b) => b.classList.remove("active"));
					btn.classList.add("active");
					currentFilter = btn.dataset.cycle;
					g.selectAll(".country").attr("fill", (d) => fillFor(d));
				});
			});
		</script>
	</body>
</html>
