<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<title>PIRLS 2026 Participants</title>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Raleway:ital,wght@0,100..900;1,100..900&display=swap"
			rel="stylesheet" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,wght@0,400;0,600;1,400&display=swap"
			rel="stylesheet" />
		<script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
		<style>
			:root {
				--dominant: #b83726;
			}
			* {
				box-sizing: border-box;
			}
			body {
				margin: 0;
				min-height: 100vh;
				font-family: "Source Serif 4", Georgia, serif;
				background: #fdfdfd;
				color: #333;
				padding: 24px 36px 0;
				box-sizing: border-box;
			}
			#top-bar {
				display: flex;
				align-items: stretch;
				height: 220px;
				border-bottom: 1px solid rgba(184, 55, 38, 0.1);
				overflow: hidden;
			}
			#top-left {
				flex-shrink: 0;
				width: 280px;
				padding: 28px 32px 24px;
				border-right: 1px solid rgba(184, 55, 38, 0.08);
				display: flex;
				flex-direction: column;
				justify-content: space-between;
			}
			.brand {
				color: var(--dominant);
				font-family: "Raleway", sans-serif;
				font-weight: 700;
				font-size: 1.45rem;
				line-height: 1.25;
				letter-spacing: 0.02em;
				border-left: 3px solid var(--dominant);
				padding-left: 14px;
			}
			#filter-bar {
				display: flex;
				flex-direction: column;
				gap: 10px;
				user-select: none;
				-webkit-user-select: none;
			}
			#filter-bar select,
			#filter-bar input#search {
				width: 100%;
				border: none;
				border-bottom: 1px solid rgba(184, 55, 38, 0.18);
				border-radius: 0;
				background: transparent;
				font-family: "Raleway", sans-serif;
				font-size: 0.76rem;
				font-weight: 600;
				letter-spacing: 0.03em;
				color: #666;
				padding: 3px 2px 4px;
				appearance: none;
				-webkit-appearance: none;
				cursor: pointer;
			}
			#filter-bar select:focus,
			#filter-bar input#search:focus {
				outline: none;
				border-bottom-color: var(--dominant);
				color: #2a1a17;
			}
			#filter-bar input#search {
				cursor: text;
			}
			#filter-bar input#search::placeholder {
				color: #b8a09a;
				font-weight: 400;
			}
			#list-view {
				height: calc(100vh - 244px);
				overflow-x: auto;
				overflow-y: hidden;
				columns: 6;
				column-gap: 20px;
				padding: 6px 28px 0;
				box-sizing: border-box;
			}
			.alpha-section {
				margin-bottom: 8px;
				break-inside: avoid-column;
			}
			.alpha-letter {
				font-size: 1rem;
				font-weight: 700;
				letter-spacing: 0.15em;
				text-transform: uppercase;
				color: #b8a09a;
				padding: 6px 0 3px;
				margin-bottom: 1px;
				break-after: avoid;
			}
			.alpha-row {
				padding: 2px 5px;
				border-radius: 4px;
				break-inside: avoid;
				cursor: default;
			}
			.alpha-row:hover {
				background: rgba(184, 55, 38, 0.06);
			}
			.alpha-name {
				font-size: 1rem;
				font-weight: 400;
				color: #141414;
				text-decoration: none;
				display: block;
				white-space: nowrap;
				overflow: hidden;
				text-overflow: ellipsis;
				transition: color 0.5s;
				line-height: 1.4;
				font-family: "Lato", sans-serif;
			}
			.alpha-name:hover {
				color: var(--dominant);
			}
			.alpha-sub {
				font-size: 0.68rem;
				color: #9a8078;
				white-space: nowrap;
				overflow: hidden;
				text-overflow: ellipsis;
				line-height: 1.3;
				padding-bottom: 2px;
			}
			.alpha-empty {
				column-span: all;
				text-align: center;
				padding: 48px 0;
				color: #735a55;
				font-size: 0.95rem;
				width: 100%;
			}
			/* Detail bar */
			#detail-bar {
				flex: 1;
				padding: 14px 36px 16px;
				display: flex;
				align-items: center;
				height: 160px;
				overflow: hidden;
				position: relative;
				user-select: none;
				-webkit-user-select: none;
				text-align: center;
			}
			.db-globe-wrap {
				position: absolute;
				left: 160px;
				top: 50%;
				transform: translateY(-50%);
				width: 150px;
				overflow: hidden;
				display: flex;
				flex-direction: column;
				align-items: center;
				gap: 4px;
			}
			.db-globe-wrap .coord-globe {
				width: 120px;
				height: 120px;
				filter: drop-shadow(0 3px 8px rgba(0, 0, 0, 0.13));
			}
			.db-globe-wrap .coord-text {
				font-size: 0.9rem;
				color: #9a8078;
				letter-spacing: 0.08em;
				font-family: "Raleway", sans-serif;
				font-weight: 600;
				white-space: nowrap;
				opacity: 0;
				transition: opacity 0.3s ease;
			}
			#detail-bar.active .db-globe-wrap .coord-text {
				opacity: 1;
			}
			.db-body {
				flex: 1;
				min-width: 0;
				text-align: center;
			}
			.db-arrow-link {
				display: inline-flex;
				align-items: center;
				gap: 5px;
				margin-top: 8px;
				max-height: 0;
				overflow: hidden;
				transition:
					opacity 0.08s ease,
					max-height 0.08s ease,
					color 0.18s;
				font-size: 0.78rem;
				font-family: "Raleway", sans-serif;
				font-weight: 600;
				letter-spacing: 0.06em;
				text-transform: uppercase;
				color: white;
				border-radius: 5px;
				padding: 5px 10px;
				text-decoration: none;
				opacity: 0;
				pointer-events: none;
				background-color: var(--dominant);
			}
			#detail-bar.active .db-arrow-link {
				transition:
					opacity 0.32s ease 0.1s,
					max-height 0.3s ease,
					color 0.18s;
			}
			.db-arrow-link::after {
				content: "→";
				font-size: 0.85rem;
				transition: transform 0.18s ease;
			}
			#detail-bar.active .db-arrow-link {
				opacity: 1;
				max-height: 40px;
				pointer-events: auto;
			}

			.db-arrow-link:hover::after {
				transform: translateX(4px);
			}
			#db-name {
				font-size: 1.75rem;
				font-weight: 600;
				color: #2a1a17;
				line-height: 1.2;
				margin-bottom: 4px;
				transition: color 0.2s;
			}
			#db-name.placeholder {
				font-size: 1.2rem;
				margin-top: 20px;
				font-weight: 400;
				color: #c8b0a8;
				font-style: italic;
			}
			#db-cycles,
			#db-languages {
				font-size: 1.1rem;
				color: #9a8078;
				line-height: 1.45;
				transition: opacity 0.2s;
				white-space: nowrap;
				overflow: hidden;
				text-overflow: ellipsis;
			}
			#detail-bar:not(.active) #db-cycles,
			#detail-bar:not(.active) #db-languages {
				opacity: 0;
			}
			/* Selection dimming */
			.alpha-row {
				transition:
					background 0.12s,
					opacity 0.18s;
			}
			#list-view.has-selection .alpha-row:not(.selected) {
				opacity: 0.22;
			}
			.alpha-row.selected {
				background: rgba(184, 55, 38, 0.06);
			}
			/* Background ambient nodes */
			/* Intro overlay */
			#intro-overlay {
				position: fixed;
				inset: 0;
				background: #fdfdfd;
				z-index: 500;
				display: flex;
				flex-direction: column;
				transition: opacity 1.4s ease;
				pointer-events: none;
			}
			#intro-overlay.fade-out {
				opacity: 0;
			}
			#intro-viz {
				flex: 1;
				width: 100%;
				overflow: hidden;
			}
			/* Node entrance animation — applied to .card inside intro so d3 translate on .node doesn't conflict */
			#intro-viz .node .card {
				transform-box: fill-box;
				transform-origin: center;
				animation: nodeIn 0.7s backwards cubic-bezier(0.34, 1.56, 0.64, 1);
			}
			@keyframes nodeIn {
				from {
					opacity: 0;
					transform: scale(0);
				}
				to {
					opacity: 1;
					transform: scale(1);
				}
			}
			@media (max-width: 640px) {
				#top-bar {
					flex-direction: column;
					height: auto;
				}
				#top-left {
					width: 100%;
					border-right: none;
					border-bottom: 1px solid rgba(184, 55, 38, 0.08);
					padding: 16px;
					flex-direction: row;
					align-items: center;
					justify-content: space-between;
				}
				#filter-bar {
					flex-direction: row;
					gap: 10px;
				}
				#detail-bar {
					height: 96px;
					padding: 8px 16px;
				}
				.db-globe-wrap {
					left: 16px;
				}
				#list-view {
					columns: 2;
					padding: 6px 14px 0;
					height: calc(100vh - 260px);
				}
			}
		</style>
	</head>
	<body>
		<!-- Main page -->
		<div id="top-bar">
			<div id="top-left">
				<div class="brand">PIRLS 2026 Participants</div>
				<div id="filter-bar">
					<select id="cycle-filter">
						<option value="all">All Cycles</option>
						<option value="P21">PIRLS 2021</option>
						<option value="P16">PIRLS 2016</option>
						<option value="P11">PIRLS 2011</option>
						<option value="P06">PIRLS 2006</option>
						<option value="P01">PIRLS 2001</option>
					</select>
					<input type="text" id="search" placeholder="Search countries…" />
				</div>
			</div>
			<div id="detail-bar">
				<div class="db-globe-wrap" id="db-globe"></div>
				<div class="db-body">
					<div id="db-name" class="placeholder">Hover a country to see details</div>
					<div id="db-cycles"></div>
					<div id="db-languages"></div>
					<a id="db-link" href="#" class="db-arrow-link" aria-label="Go to country page">Country Chapter</a>
				</div>
			</div>
		</div>
		<div id="list-view"></div>

		<!-- Intro animation overlay -->
		<div id="intro-overlay">
			<div class="header">
				<span class="brand">PIRLS 2026 Participants</span>
			</div>
			<div id="intro-viz"></div>
		</div>

		<script>
			d3.csv("CountryInfoforMap.csv")
				.then(function (RAW) {
					function parse(r) {
						const cycles = [];
						if (r["Participated P21 "] === "X") cycles.push("P21");
						if (r["Participated P16"] === "X") cycles.push("P16");
						if (r["Participated P11"] === "X") cycles.push("P11");
						if (r["Participated P06"] === "X") cycles.push("P06");
						if (r["Participated P01"] === "X") cycles.push("P01");
						const langStr = (r["P26 Assessment Languages"] || "").trim();
						const languages = langStr ? langStr.split(/\s*,\s*/) : [];
						return {
							id: r.Country.replace(/\s+/g, "-").replace(/[(),]/g, ""),
							name: r.Country,
							cycles,
							cycleCount: cycles.length,
							languages,
							langCount: languages.length,
						};
					}

					const DATA = RAW.map((r) => ({ ...parse(r), _raw: r }));

					const COUNTRY_TO_COORDS = {
						Albania: [41.15, 20.17],
						Australia: [-25.27, 133.78],
						Austria: [47.52, 14.55],
						Azerbaijan: [40.14, 47.58],
						Bahrain: [26.03, 50.55],
						"Belgium (Flemish)": [51, 4.3],
						"Belgium (French)": [50.3, 4.45],
						Brazil: [-14.24, -51.93],
						Bulgaria: [42.73, 25.49],
						Canada: [56.13, -106.35],
						"Ontario, Canada": [50, -85],
						"Quebec, Canada": [52, -72],
						"Chinese Taipei": [23.7, 120.96],
						Cyprus: [35.13, 33.43],
						"Czech Republic": [49.82, 15.47],
						Denmark: [56.26, 9.5],
						England: [52.36, -1.17],
						Finland: [61.92, 25.75],
						France: [46.23, 2.21],
						Georgia: [42.32, 43.36],
						Germany: [51.17, 10.45],
						"Hong Kong SAR": [22.4, 114.11],
						Hungary: [47.16, 19.5],
						"Iran, Islamic Rep. of": [32.43, 53.69],
						Ireland: [53.41, -8.24],
						Israel: [31.05, 34.85],
						Italy: [41.87, 12.57],
						Jordan: [30.59, 36.24],
						Kazakhstan: [48.02, 66.92],
						"Korea, Rep. of": [35.91, 127.77],
						Kuwait: [29.31, 47.48],
						Latvia: [56.88, 24.6],
						Lithuania: [55.17, 23.88],
						"Macao SAR": [22.2, 113.54],
						Malta: [35.94, 14.38],
						Montenegro: [42.71, 19.37],
						Morocco: [31.79, -7.09],
						Netherlands: [52.13, 5.29],
						"New Zealand": [-40.9, 174.89],
						"North Macedonia": [41.61, 21.75],
						"Northern Ireland": [54.61, -6.69],
						Norway: [60.47, 8.47],
						Oman: [21.51, 55.92],
						Poland: [51.92, 19.15],
						Portugal: [39.4, -8.22],
						Qatar: [25.35, 51.18],
						Romania: [45.94, 24.97],
						"Saudi Arabia": [23.89, 45.08],
						"Saudi Arabia (RCJY)": [23.89, 45.08],
						Scotland: [56.49, -4.2],
						"South Africa": [-30.56, 22.94],
						Serbia: [44.02, 21.01],
						Singapore: [1.35, 103.82],
						"Slovak Republic": [48.67, 19.7],
						Slovenia: [46.15, 14.99],
						Spain: [40.46, -3.75],
						Sweden: [60.13, 18.64],
						Tajikistan: [38.86, 71.28],
						"United Arab Emirates": [23.42, 53.85],
						"Abu Dhabi, UAE": [24.47, 54.37],
						"Dubai, UAE": [25.2, 55.27],
						"Sharjah, UAE": [25.36, 55.39],
						Uzbekistan: [41.38, 64.59],
						Wales: [52.13, -3.78],
					};

					const globeAnim = { lat: 20, lon: 0, targetLat: 20, targetLon: 0, idle: true, gridEl: null, dotEl: null };

					function makeGridPaths(lat, lon) {
						const r = 0.88;
						const DEG = Math.PI / 180;
						const φ0 = lat * DEG,
							λ0 = lon * DEG;

						function project(φ, λ) {
							const dλ = λ - λ0;
							const x = Math.cos(φ) * Math.sin(dλ);
							const y = Math.sin(φ) * Math.cos(φ0) - Math.cos(φ) * Math.sin(φ0) * Math.cos(dλ);
							const z = Math.sin(φ) * Math.sin(φ0) + Math.cos(φ) * Math.cos(φ0) * Math.cos(dλ);
							return [x * r, -y * r, z];
						}

						function makePath(pts) {
							let d = "",
								on = false;
							for (const [φ, λ] of pts) {
								const [px, py, z] = project(φ, λ);
								if (z >= 0) {
									d += (on ? "L" : "M") + px.toFixed(3) + "," + py.toFixed(3);
									on = true;
								} else on = false;
							}
							return d;
						}

						function gridPath(d, strong) {
							const a = strong ? 0.3 : 0.16,
								w = strong ? 0.038 : 0.018;
							return d ? `<path d="${d}" stroke="rgba(184,55,38,${a})" stroke-width="${w}" fill="none"/>` : "";
						}

						const latLines = [-60, -30, 0, 30, 60]
							.map((deg) => {
								const φ = deg * DEG;
								const pts = Array.from({ length: 121 }, (_, i) => [φ, (-180 + i * 3) * DEG]);
								return gridPath(makePath(pts), deg === 0);
							})
							.join("");

						const lonLines = Array.from({ length: 12 }, (_, i) => i * 30)
							.map((deg) => {
								const λ = deg * DEG;
								const pts = Array.from({ length: 61 }, (_, i) => [(-90 + i * 3) * DEG, λ]);
								return gridPath(makePath(pts), deg === 0);
							})
							.join("");

						return latLines + lonLines;
					}

					function initGlobe() {
						const r = 0.88;
						dbGlobe.innerHTML = `<svg class="coord-globe" viewBox="-1 -1 2 2" xmlns="http://www.w3.org/2000/svg">
							<defs><clipPath id="gc"><circle cx="0" cy="0" r="${r}"/></clipPath></defs>
							<circle cx="0" cy="0" r="${r}" fill="rgba(253,242,241,0.75)"/>
							<g id="globe-grid" clip-path="url(#gc)"></g>
							<circle cx="0" cy="0" r="${r}" fill="none" stroke="rgba(184,55,38,0.45)" stroke-width="0.055"/>
							<g id="globe-dot" opacity="0" style="transition:opacity 0.25s ease">
								<circle cx="0" cy="0" r="0.13" fill="rgba(184,55,38,0.22)"/>
								<circle cx="0" cy="0" r="0.09" fill="#b83726"/>
							</g>
						</svg><div class="coord-text" id="globe-coord"></div>`;
						globeAnim.gridEl = document.getElementById("globe-grid");
						globeAnim.dotEl = document.getElementById("globe-dot");

						(function tick() {
							if (globeAnim.idle) {
								globeAnim.lon += 0.2;
							} else {
								let dLat = globeAnim.targetLat - globeAnim.lat;
								let dLon = globeAnim.targetLon - globeAnim.lon;
								while (dLon > 180) dLon -= 360;
								while (dLon < -180) dLon += 360;
								globeAnim.lat += dLat * 0.06;
								globeAnim.lon += dLon * 0.06;
							}
							globeAnim.gridEl.innerHTML = makeGridPaths(globeAnim.lat, globeAnim.lon);
							requestAnimationFrame(tick);
						})();
					}

					function formatCoords(lat, lon) {
						const latDir = lat >= 0 ? "N" : "S";
						const lonDir = lon >= 0 ? "E" : "W";
						return Math.abs(lat).toFixed(1) + "° " + latDir + " · " + Math.abs(lon).toFixed(1) + "° " + lonDir;
					}

					function escapeHtml(value) {
						return String(value ?? "").replace(/[&<>"']/g, (char) => {
							return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[char];
						});
					}

					const LANGUAGE_COLORS = ["#fdf2f1", "#f9e4e1", "#f2d0cb", "#eab8b0", "#d99689", "#c76552", "#b83726"];
					function fillFor(d) {
						return LANGUAGE_COLORS[Math.min(Math.max(0, d.cycleCount || 0), LANGUAGE_COLORS.length - 1)];
					}
					function shapeFor(d) {
						return (d.langCount || 0) === 1 ? "circle" : "card";
					}
					function nodeRadius(d) {
						return Math.max(28 + d.cycleCount * 1, 36);
					}
					function cardSize() {
						const base = 24;
						return { w: Math.max(95, 70) + base, h: base * 2.2 };
					}
					function splitLabel(text, maxCharsPerLine, maxLines) {
						const words = String(text || "")
							.split(/\s+/)
							.filter(Boolean);
						const lines = [];
						let current = "";
						words.forEach((word) => {
							const next = current ? current + " " + word : word;
							if (!current || next.length <= maxCharsPerLine) {
								current = next;
								return;
							}
							lines.push(current);
							current = word;
						});
						if (current) lines.push(current);
						if (!lines.length) lines.push(String(text || ""));
						return lines.slice(0, maxLines);
					}
					function drawNodeLabel(group, text, options) {
						const lines = splitLabel(text, options.maxCharsPerLine, options.maxLines);
						const textEl = group
							.append("text")
							.attr("text-anchor", "middle")
							.attr("dominant-baseline", "central")
							.style("font-size", options.fontSize + "px")
							.style("fill", "#0d0d0d")
							.style("font-weight", 700);
						const startY = -((lines.length - 1) * options.lineHeight) / 2;
						lines.forEach((line, i) => {
							textEl
								.append("tspan")
								.attr("x", 0)
								.attr("dy", i === 0 ? startY + "em" : options.lineHeight + "em")
								.text(line);
						});
					}

					const CYCLE_YEAR = { P01: "2001", P06: "2006", P11: "2011", P16: "2016", P21: "2021" };

					const detailBar = document.getElementById("detail-bar");
					const dbGlobe = document.getElementById("db-globe");
					const dbName = document.getElementById("db-name");
					const dbCycles = document.getElementById("db-cycles");
					const dbLanguages = document.getElementById("db-languages");
					const dbLink = document.getElementById("db-link");

					// TODO: replace with your actual country page URL pattern
					function countryUrl(d) {
						return "country/" + d.id.toLowerCase();
					}

					function showDetail(d) {
						const coords = COUNTRY_TO_COORDS[d.name];
						const coordEl = document.getElementById("globe-coord");
						if (coords) {
							const [lat, lon] = coords;
							globeAnim.targetLat = lat;
							globeAnim.targetLon = lon;
							globeAnim.idle = false;
							if (globeAnim.dotEl) globeAnim.dotEl.setAttribute("opacity", "1");
							if (coordEl) coordEl.textContent = formatCoords(lat, lon);
						} else {
							if (coordEl) coordEl.textContent = "";
						}
						dbName.textContent = d.name;
						dbName.classList.remove("placeholder");
						dbCycles.textContent =
							"Previous Participation: " + (d.cycles.length ? d.cycles.map((c) => CYCLE_YEAR[c] || c).join(", ") : "—");
						dbLanguages.textContent =
							"PIRLS 2026 Assessment Languages: " + (d.languages && d.languages.length ? d.languages.join(", ") : "—");
						dbLink.href = countryUrl(d);
						detailBar.classList.add("active");
					}

					function resetDetail() {
						if (state && state.selectedId) return;
						globeAnim.idle = true;
						if (globeAnim.dotEl) globeAnim.dotEl.setAttribute("opacity", "0");
						const coordEl = document.getElementById("globe-coord");
						if (coordEl) coordEl.textContent = "";
						dbName.textContent = "Hover a country to see details";
						dbName.classList.add("placeholder");
						dbCycles.textContent = "";
						dbLanguages.textContent = "";
						detailBar.classList.remove("active");
					}

					let state = { cycleFilter: "all", search: "", selectedId: null };

					function filteredData() {
						let list = state.cycleFilter === "all" ? DATA : DATA.filter((d) => d.cycles.includes(state.cycleFilter));
						if (state.search.trim()) {
							const q = state.search.trim().toLowerCase();
							list = list.filter((d) => d.name.toLowerCase().includes(q));
						}
						return list;
					}

					function updateSelection() {
						const listEl = document.getElementById("list-view");
						listEl.classList.toggle("has-selection", !!state.selectedId);
						listEl.querySelectorAll(".alpha-row").forEach((row) => {
							row.classList.toggle("selected", row.dataset.id === state.selectedId);
						});
					}

					function renderListView() {
						const listEl = document.getElementById("list-view");
						const list = filteredData().sort((a, b) => a.name.localeCompare(b.name));

						if (!list.length) {
							listEl.innerHTML = '<div class="alpha-empty">No countries match the current filter.</div>';
							return;
						}

						const groups = {};
						list.forEach((d) => {
							const letter = d.name[0].toUpperCase();
							if (!groups[letter]) groups[letter] = [];
							groups[letter].push(d);
						});

						listEl.innerHTML = Object.keys(groups)
							.sort()
							.map((letter) => {
								const rows = groups[letter]
									.map((d) => {
										const sel = d.id === state.selectedId ? " selected" : "";
										return `<div class="alpha-row${sel}" data-id="${escapeHtml(d.id)}"><a class="alpha-name" href="#">${escapeHtml(d.name)}</a></div>`;
									})
									.join("");
								return `<div class="alpha-section"><div class="alpha-letter">${letter}</div>${rows}</div>`;
							})
							.join("");

						listEl.classList.toggle("has-selection", !!state.selectedId);

						const dataMap = Object.fromEntries(DATA.map((d) => [d.id, d]));
						listEl.querySelectorAll(".alpha-row").forEach((row) => {
							const d = dataMap[row.dataset.id];
							if (!d) return;

							row.addEventListener("mouseenter", () => {
								if (!state.selectedId) showDetail(d);
							});
							row.addEventListener("mouseleave", () => {
								if (!state.selectedId) resetDetail();
							});
							row.addEventListener("click", (e) => {
								e.preventDefault();
								const wasSelected = state.selectedId === d.id;
								state.selectedId = wasSelected ? null : d.id;
								updateSelection();
								if (state.selectedId) {
									showDetail(d);
								} else {
									resetDetail();
								}
							});
						});
					}

					document.addEventListener("click", (e) => {
						if (state.selectedId && !e.target.closest(".alpha-row")) {
							state.selectedId = null;
							updateSelection();
							resetDetail();
						}
					});

					function runIntro() {
						const overlay = document.getElementById("intro-overlay");
						const el = document.getElementById("intro-viz");
						const w = window.innerWidth;
						const headerH = overlay.querySelector(".header").getBoundingClientRect().height;
						const h = window.innerHeight - headerH;

						const nodes = DATA.map((d) => {
							const shape = shapeFor(d);
							const r = nodeRadius(d);
							const cs = cardSize();
							return {
								...d,
								shape,
								radius: shape === "card" ? Math.max(cs.w, cs.h) / 2 + 2 : r + 2,
								cardW: cs.w,
								cardH: cs.h,
								radiusCircle: r,
								x: w / 2 + (Math.random() - 0.5) * w * 0.4,
								y: h / 2 + (Math.random() - 0.5) * h * 0.35,
							};
						});

						const svg = d3.select("#intro-viz").append("svg").attr("width", w).attr("height", h);

						const g = svg
							.selectAll("g.node")
							.data(nodes)
							.join("g")
							.attr("class", "node")
							.attr("transform", (d) => `translate(${d.x},${d.y})`);

						g.each(function (d, i) {
							const g2 = d3.select(this).append("g").attr("class", "card");
							g2.style("animation-delay", i * 10 + "ms");
							if (d.shape === "circle") {
								g2.append("circle")
									.attr("r", d.radiusCircle)
									.attr("fill", fillFor(d))
									.attr("stroke", "rgba(184,55,38,0.2)")
									.attr("stroke-width", 1);
								drawNodeLabel(g2, d.name, { fontSize: 12, maxCharsPerLine: 9, maxLines: 3, lineHeight: 1.05 });
							} else {
								const w2 = d.cardW / 2,
									h2 = d.cardH / 2;
								g2.append("rect")
									.attr("x", -w2)
									.attr("y", -h2)
									.attr("width", d.cardW)
									.attr("height", d.cardH)
									.attr("rx", 8)
									.attr("ry", 8)
									.attr("fill", fillFor(d))
									.attr("stroke", "rgba(184,55,38,0.2)")
									.attr("stroke-width", 1);
								drawNodeLabel(g2, d.name, { fontSize: 12, maxCharsPerLine: 16, maxLines: 2, lineHeight: 1.05 });
							}
						});

						const introSim = d3
							.forceSimulation(nodes)
							.velocityDecay(0.7)
							.alphaDecay(0.05)
							.force(
								"collide",
								d3
									.forceCollide()
									.radius((d) => d.radius)
									.iterations(2),
							)
							.force("x", d3.forceX(w / 2).strength(0.02))
							.force("y", d3.forceY(h / 2).strength(0.1))
							.on("tick", () => {
								g.attr("transform", (d) => {
									d.x = Math.max(d.radius, Math.min(w - d.radius, d.x));
									d.y = Math.max(d.radius, Math.min(h - d.radius, d.y));
									return `translate(${d.x},${d.y})`;
								});
							});

						// hold until last node has fully animated in, then fade out
						const holdMs = DATA.length * 13 + 1400;
						setTimeout(() => {
							overlay.classList.add("fade-out");
							setTimeout(() => {
								introSim.stop();
								overlay.style.display = "none";
							}, 1500);
						}, holdMs);
					}

					document.getElementById("cycle-filter").addEventListener("change", (e) => {
						state.cycleFilter = e.target.value;
						renderListView();
					});
					document.getElementById("search").addEventListener("input", (e) => {
						state.search = e.target.value;
						renderListView();
					});
					window.addEventListener("resize", renderListView);

					initGlobe();
					renderListView();
					runIntro();
				})
				.catch(function (err) {
					console.error("Failed to load CountryInfoforMap.csv:", err);
				});
		</script>
	</body>
</html>
