			:root {
				--dominant: #b83726;
			}
			* {
				box-sizing: border-box;
			}
			body {
				margin: 0;
				min-height: 100vh;
				font-family: "Source Serif 4", Georgia, serif;
				background: #fdfdfd;
				color: #333;
				padding: 24px 36px 0;
				box-sizing: border-box;
			}
			#top-bar {
				display: flex;
				align-items: stretch;
				height: 220px;
				border-bottom: 1px solid rgba(184, 55, 38, 0.1);
				overflow: hidden;
			}
			#top-left {
				flex-shrink: 0;
				width: 280px;
				padding: 28px 32px 24px;
				border-right: 1px solid rgba(184, 55, 38, 0.08);
				display: flex;
				flex-direction: column;
				justify-content: space-between;
			}
			.brand {
				color: var(--dominant);
				font-family: "Raleway", sans-serif;
				font-weight: 700;
				font-size: 1.45rem;
				line-height: 1.25;
				letter-spacing: 0.02em;
				border-left: 3px solid var(--dominant);
				padding-left: 14px;
			}
			#filter-bar {
				display: flex;
				flex-direction: column;
				gap: 10px;
				user-select: none;
				-webkit-user-select: none;
			}
			#filter-bar select,
			#filter-bar input#search {
				width: 100%;
				border: none;
				border-bottom: 1px solid rgba(184, 55, 38, 0.18);
				border-radius: 0;
				background: transparent;
				font-family: "Raleway", sans-serif;
				font-size: 0.76rem;
				font-weight: 600;
				letter-spacing: 0.03em;
				color: #666;
				padding: 3px 2px 4px;
				appearance: none;
				-webkit-appearance: none;
				cursor: pointer;
			}
			#filter-bar select:focus,
			#filter-bar input#search:focus {
				outline: none;
				border-bottom-color: var(--dominant);
				color: #2a1a17;
			}
			#filter-bar input#search {
				cursor: text;
			}
			#filter-bar input#search::placeholder {
				color: #b8a09a;
				font-weight: 400;
			}
			#list-view {
				height: calc(100vh - 244px);
				overflow-x: auto;
				overflow-y: hidden;
				columns: 6;
				column-gap: 20px;
				padding: 6px 28px 0;
				box-sizing: border-box;
			}
			.alpha-section {
				margin-bottom: 8px;
				break-inside: avoid-column;
			}
			.alpha-letter {
				font-size: 1rem;
				font-weight: 700;
				letter-spacing: 0.15em;
				text-transform: uppercase;
				color: #b8a09a;
				padding: 6px 0 3px;
				margin-bottom: 1px;
				break-after: avoid;
			}
			.alpha-row {
				padding: 2px 5px;
				border-radius: 4px;
				break-inside: avoid;
				cursor: default;
			}
			.alpha-row:hover {
				background: rgba(184, 55, 38, 0.06);
			}
			.alpha-name {
				font-size: 1rem;
				font-weight: 400;
				color: #141414;
				text-decoration: none;
				display: block;
				white-space: nowrap;
				overflow: hidden;
				text-overflow: ellipsis;
				transition: color 0.5s;
				line-height: 1.4;
				font-family: "Lato", sans-serif;
			}
			.alpha-name:hover {
				color: var(--dominant);
			}
			.alpha-sub {
				font-size: 0.68rem;
				color: #9a8078;
				white-space: nowrap;
				overflow: hidden;
				text-overflow: ellipsis;
				line-height: 1.3;
				padding-bottom: 2px;
			}
			.alpha-empty {
				column-span: all;
				text-align: center;
				padding: 48px 0;
				color: #735a55;
				font-size: 0.95rem;
				width: 100%;
			}
			/* Detail bar */
			#detail-bar {
				flex: 1;
				padding: 14px 36px 16px;
				display: flex;
				align-items: center;
				height: 160px;
				overflow: hidden;
				position: relative;
				user-select: none;
				-webkit-user-select: none;
				text-align: center;
			}
			.db-globe-wrap {
				position: absolute;
				left: 160px;
				top: 50%;
				transform: translateY(-50%);
				width: 150px;
				overflow: hidden;
				display: flex;
				flex-direction: column;
				align-items: center;
				gap: 4px;
			}
			.db-globe-wrap .coord-globe {
				width: 120px;
				height: 120px;
				filter: drop-shadow(0 3px 8px rgba(0, 0, 0, 0.13));
			}
			.db-globe-wrap .coord-text {
				font-size: 0.9rem;
				color: #9a8078;
				letter-spacing: 0.08em;
				font-family: "Raleway", sans-serif;
				font-weight: 600;
				white-space: nowrap;
				opacity: 0;
				transition: opacity 0.3s ease;
			}
			#detail-bar.active .db-globe-wrap .coord-text {
				opacity: 1;
			}
			.db-globe-wrap .continent-text {
				font-size: 0.72rem;
				color: #b8a39a;
				letter-spacing: 0.12em;
				text-transform: uppercase;
				font-family: "Raleway", sans-serif;
				font-weight: 600;
				white-space: nowrap;
				opacity: 0;
				transition: opacity 0.3s ease;
			}
			#detail-bar.active .db-globe-wrap .continent-text {
				opacity: 1;
			}
			.db-body {
				flex: 1;
				min-width: 0;
				text-align: center;
			}
			.db-arrow-link {
				display: inline-flex;
				align-items: center;
				gap: 5px;
				margin-top: 8px;
				max-height: 0;
				overflow: hidden;
				transition:
					opacity 0.08s ease,
					max-height 0.08s ease,
					color 0.18s;
				font-size: 0.78rem;
				font-family: "Raleway", sans-serif;
				font-weight: 600;
				letter-spacing: 0.06em;
				text-transform: uppercase;
				color: white;
				border-radius: 5px;
				padding: 5px 10px;
				text-decoration: none;
				opacity: 0;
				pointer-events: none;
				background-color: var(--dominant);
			}
			#detail-bar.active .db-arrow-link {
				transition:
					opacity 0.32s ease 0.1s,
					max-height 0.3s ease,
					color 0.18s;
			}
			.db-arrow-link::after {
				content: "→";
				font-size: 0.85rem;
				transition: transform 0.18s ease;
			}
			#detail-bar.active .db-arrow-link {
				opacity: 1;
				max-height: 40px;
				pointer-events: auto;
			}

			.db-arrow-link:hover::after {
				transform: translateX(4px);
			}
			#db-name {
				font-size: 1.75rem;
				font-weight: 600;
				color: #2a1a17;
				line-height: 1.2;
				margin-bottom: 4px;
				transition: color 0.2s;
			}
			#db-name.placeholder {
				font-size: 1.2rem;
				margin-top: 20px;
				font-weight: 400;
				color: #c8b0a8;
				font-style: italic;
			}
			#db-cycles,
			#db-languages {
				font-size: 1.1rem;
				color: #9a8078;
				line-height: 1.45;
				transition: opacity 0.2s;
				white-space: nowrap;
				overflow: hidden;
				text-overflow: ellipsis;
			}
			#detail-bar:not(.active) #db-cycles,
			#detail-bar:not(.active) #db-languages {
				opacity: 0;
			}
			/* Selection dimming */
			.alpha-row {
				transition:
					background 0.12s,
					opacity 0.18s;
			}
			#list-view.has-selection .alpha-row:not(.selected) {
				opacity: 0.22;
			}
			.alpha-row.selected {
				background: rgba(184, 55, 38, 0.06);
			}
			/* Background ambient nodes */
			@media (max-width: 640px) {
				#top-bar {
					flex-direction: column;
					height: auto;
				}
				#top-left {
					width: 100%;
					border-right: none;
					border-bottom: 1px solid rgba(184, 55, 38, 0.08);
					padding: 16px;
					flex-direction: row;
					align-items: center;
					justify-content: space-between;
				}
				#filter-bar {
					flex-direction: row;
					gap: 10px;
				}
				#detail-bar {
					height: 96px;
					padding: 8px 16px;
				}
				.db-globe-wrap {
					left: 16px;
				}
				#list-view {
					columns: 2;
					padding: 6px 14px 0;
					height: calc(100vh - 260px);
				}
			}
		</style>
	</head>

						Peru: "South America",
						Suriname: "South America",
						Uruguay: "South America",
						Venezuela: "South America",
						Australia: "Oceania",
						Fiji: "Oceania",
						"New Caledonia": "Oceania",
						"New Zealand": "Oceania",
						"Papua New Guinea": "Oceania",
						"Solomon Is.": "Oceania",
						Vanuatu: "Oceania",
						Antarctica: "Antarctica",
						"Fr. S. Antarctic Lands": "Antarctica",
					};

					let CONTINENT_SHAPES = null;
					d3.json("https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json").then((topo) => {
						const byContinent = {};
						topo.objects.countries.geometries.forEach((g) => {
							const continent = CONTINENT_OF_NE[g.properties.name];
							if (!continent) return;
							(byContinent[continent] = byContinent[continent] || []).push(g);
						});
						CONTINENT_SHAPES = {};
						Object.keys(byContinent).forEach((continent) => {
							CONTINENT_SHAPES[continent] = topojson.merge(topo, byContinent[continent]);
						});
					});

					const globeAnim = {
						lat: 20,
						lon: 0,
						targetLat: 20,
						targetLon: 0,
						idle: true,
						continent: null,
						gridEl: null,
						dotEl: null,
						continentEl: null,
					};
					const globeProjection = d3.geoOrthographic().scale(0.88).translate([0, 0]).clipAngle(90);
					const globePath = d3.geoPath(globeProjection);

					const GRATICULE_LINES = [-60, -30, 0, 30, 60]
						.map((deg) => ({
							strong: deg === 0,
							line: { type: "LineString", coordinates: Array.from({ length: 121 }, (_, i) => [-180 + i * 3, deg]) },
						}))
						.concat(
							Array.from({ length: 12 }, (_, i) => i * 30).map((deg) => ({
								strong: deg === 0,
								line: { type: "LineString", coordinates: Array.from({ length: 61 }, (_, i) => [deg, -90 + i * 3]) },
							})),
						);

					function makeGridPaths() {
						return GRATICULE_LINES.map(({ strong, line }) => {
							const d = globePath(line);
							if (!d) return "";
							const a = strong ? 0.3 : 0.16,
								w = strong ? 0.038 : 0.018;
							return `<path d="${d}" stroke="rgba(184,55,38,${a})" stroke-width="${w}" fill="none"/>`;
						}).join("");
					}

					function initGlobe() {
						const r = 0.88;
						dbGlobe.innerHTML = `<svg class="coord-globe" viewBox="-1 -1 2 2" xmlns="http://www.w3.org/2000/svg">
							<defs><clipPath id="gc"><circle cx="0" cy="0" r="${r}"/></clipPath></defs>
							<circle cx="0" cy="0" r="${r}" fill="rgba(253,242,241,0.75)"/>
							<g clip-path="url(#gc)">
								<path id="globe-continent" opacity="0" fill="rgba(184,55,38,0.16)" stroke="rgba(184,55,38,0.5)" stroke-width="0.012" style="transition:opacity 0.3s ease"></path>
								<g id="globe-grid"></g>
							</g>
							<circle cx="0" cy="0" r="${r}" fill="none" stroke="rgba(184,55,38,0.45)" stroke-width="0.055"/>
							<g id="globe-dot" opacity="0" style="transition:opacity 0.25s ease">
								<circle cx="0" cy="0" r="0.13" fill="rgba(184,55,38,0.22)"/>
								<circle cx="0" cy="0" r="0.09" fill="#b83726"/>
							</g>
						</svg><div class="coord-text" id="globe-coord"></div><div class="continent-text" id="globe-continent-label"></div>`;
						globeAnim.gridEl = document.getElementById("globe-grid");
						globeAnim.dotEl = document.getElementById("globe-dot");
						globeAnim.continentEl = document.getElementById("globe-continent");

						(function tick() {
							if (globeAnim.idle) {
								globeAnim.lon += 0.2;
							} else {
								let dLat = globeAnim.targetLat - globeAnim.lat;
								let dLon = globeAnim.targetLon - globeAnim.lon;
								while (dLon > 180) dLon -= 360;
								while (dLon < -180) dLon += 360;
								globeAnim.lat += dLat * 0.06;
								globeAnim.lon += dLon * 0.06;
							}
							globeProjection.rotate([-globeAnim.lon, -globeAnim.lat]);
							globeAnim.gridEl.innerHTML = makeGridPaths();
							const shape = globeAnim.continent && CONTINENT_SHAPES ? CONTINENT_SHAPES[globeAnim.continent] : null;
							globeAnim.continentEl.setAttribute("d", shape ? globePath(shape) || "" : "");
							requestAnimationFrame(tick);
						})();
					}

					function formatCoords(lat, lon) {
						const latDir = lat >= 0 ? "N" : "S";
						const lonDir = lon >= 0 ? "E" : "W";
						return Math.abs(lat).toFixed(1) + "° " + latDir + " · " + Math.abs(lon).toFixed(1) + "° " + lonDir;
					}

					function escapeHtml(value) {
						return String(value ?? "").replace(/[&<>"']/g, (char) => {
							return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[char];
						});
					}

					const LANGUAGE_COLORS = ["#fdf2f1", "#f9e4e1", "#f2d0cb", "#eab8b0", "#d99689", "#c76552", "#b83726"];
					function fillFor(d) {
						return LANGUAGE_COLORS[Math.min(Math.max(0, d.cycleCount || 0), LANGUAGE_COLORS.length - 1)];
					}
					function shapeFor(d) {
						return (d.langCount || 0) === 1 ? "circle" : "card";
					}
					function nodeRadius(d) {
						return Math.max(28 + d.cycleCount * 1, 36);
					}
					function cardSize() {
						const base = 24;
						return { w: Math.max(95, 70) + base, h: base * 2.2 };
					}
					function splitLabel(text, maxCharsPerLine, maxLines) {
						const words = String(text || "")
							.split(/\s+/)
							.filter(Boolean);
						const lines = [];
						let current = "";
						words.forEach((word) => {
							const next = current ? current + " " + word : word;
							if (!current || next.length <= maxCharsPerLine) {
								current = next;
								return;
							}
							lines.push(current);
							current = word;
						});
						if (current) lines.push(current);
						if (!lines.length) lines.push(String(text || ""));
						return lines.slice(0, maxLines);
					}
					function drawNodeLabel(group, text, options) {
						const lines = splitLabel(text, options.maxCharsPerLine, options.maxLines);
						const textEl = group
							.append("text")
							.attr("text-anchor", "middle")
							.attr("dominant-baseline", "central")
							.style("font-size", options.fontSize + "px")
							.style("fill", "#0d0d0d")
							.style("font-weight", 700);
						const startY = -((lines.length - 1) * options.lineHeight) / 2;
						lines.forEach((line, i) => {
							textEl
								.append("tspan")
								.attr("x", 0)
								.attr("dy", i === 0 ? startY + "em" : options.lineHeight + "em")
								.text(line);
						});
					}

					const CYCLE_YEAR = { P01: "2001", P06: "2006", P11: "2011", P16: "2016", P21: "2021" };

					const detailBar = document.getElementById("detail-bar");
					const dbGlobe = document.getElementById("db-globe");
					const dbName = document.getElementById("db-name");
					const dbCycles = document.getElementById("db-cycles");
					const dbLanguages = document.getElementById("db-languages");
					const dbLink = document.getElementById("db-link");

					// TODO: replace with your actual country page URL pattern
					function countryUrl(d) {
						return "country/" + d.id.toLowerCase();
					}

					function showDetail(d) {
						const coords = COUNTRY_TO_COORDS[d.name];
						const coordEl = document.getElementById("globe-coord");
						const continentEl = document.getElementById("globe-continent-label");
						if (coords) {
							const [lat, lon] = coords;
							globeAnim.targetLat = lat;
							globeAnim.targetLon = lon;
							globeAnim.idle = false;
							globeAnim.continent = COUNTRY_TO_CONTINENT[d.name] || null;
							if (globeAnim.dotEl) globeAnim.dotEl.setAttribute("opacity", "1");
							if (globeAnim.continentEl) globeAnim.continentEl.setAttribute("opacity", globeAnim.continent ? "1" : "0");
							if (coordEl) coordEl.textContent = formatCoords(lat, lon);
							if (continentEl) continentEl.textContent = globeAnim.continent || "";
						} else {
							if (coordEl) coordEl.textContent = "";
							if (continentEl) continentEl.textContent = "";
						}
						dbName.textContent = d.name;
						dbName.classList.remove("placeholder");
						dbCycles.textContent =
							"Previous Participation: " + (d.cycles.length ? d.cycles.map((c) => CYCLE_YEAR[c] || c).join(", ") : "—");
						dbLanguages.textContent =
							"PIRLS 2026 Assessment Languages: " + (d.languages && d.languages.length ? d.languages.join(", ") : "—");
						dbLink.href = countryUrl(d);
						detailBar.classList.add("active");
					}

					function resetDetail() {
						if (state && state.selectedId) return;
						globeAnim.idle = true;
						if (globeAnim.dotEl) globeAnim.dotEl.setAttribute("opacity", "0");
						if (globeAnim.continentEl) globeAnim.continentEl.setAttribute("opacity", "0");
						const coordEl = document.getElementById("globe-coord");
						if (coordEl) coordEl.textContent = "";
						const continentEl = document.getElementById("globe-continent-label");
						if (continentEl) continentEl.textContent = "";
						dbName.textContent = "Hover a country to see details";
						dbName.classList.add("placeholder");
						dbCycles.textContent = "";
						dbLanguages.textContent = "";
						detailBar.classList.remove("active");
					}

					let state = { cycleFilter: "all", search: "", selectedId: null };

					function filteredData() {
						let list = state.cycleFilter === "all" ? DATA : DATA.filter((d) => d.cycles.includes(state.cycleFilter));
						if (state.search.trim()) {
							const q = state.search.trim().toLowerCase();
							list = list.filter((d) => d.name.toLowerCase().includes(q));
						}
						return list;
					}

					function updateSelection() {
						const listEl = document.getElementById("list-view");
						listEl.classList.toggle("has-selection", !!state.selectedId);
						listEl.querySelectorAll(".alpha-row").forEach((row) => {
							row.classList.toggle("selected", row.dataset.id === state.selectedId);
						});
					}

					function renderListView() {
						const listEl = document.getElementById("list-view");
						const list = filteredData().sort((a, b) => a.name.localeCompare(b.name));

						if (!list.length) {
							listEl.innerHTML = '<div class="alpha-empty">No countries match the current filter.</div>';
							return;
						}

						const groups = {};
						list.forEach((d) => {
							const letter = d.name[0].toUpperCase();
							if (!groups[letter]) groups[letter] = [];
							groups[letter].push(d);
						});

						listEl.innerHTML = Object.keys(groups)
							.sort()
							.map((letter) => {
								const rows = groups[letter]
									.map((d) => {
										const sel = d.id === state.selectedId ? " selected" : "";
										return `<div class="alpha-row${sel}" data-id="${escapeHtml(d.id)}"><a class="alpha-name" href="#">${escapeHtml(d.name)}</a></div>`;
									})
									.join("");
								return `<div class="alpha-section"><div class="alpha-letter">${letter}</div>${rows}</div>`;
							})
							.join("");

						listEl.classList.toggle("has-selection", !!state.selectedId);

						const dataMap = Object.fromEntries(DATA.map((d) => [d.id, d]));
						listEl.querySelectorAll(".alpha-row").forEach((row) => {
							const d = dataMap[row.dataset.id];
							if (!d) return;

							row.addEventListener("mouseenter", () => {
								if (!state.selectedId) showDetail(d);
							});
							row.addEventListener("mouseleave", () => {
								if (!state.selectedId) resetDetail();
							});
							row.addEventListener("click", (e) => {
								e.preventDefault();
								const wasSelected = state.selectedId === d.id;
								state.selectedId = wasSelected ? null : d.id;
								updateSelection();
								if (state.selectedId) {
									showDetail(d);
								} else {
									resetDetail();
								}
							});
						});
					}

					document.addEventListener("click", (e) => {
						if (state.selectedId && !e.target.closest(".alpha-row")) {
							state.selectedId = null;
							updateSelection();
							resetDetail();
						}
					});

					document.getElementById("cycle-filter").addEventListener("change", (e) => {
						state.cycleFilter = e.target.value;
						renderListView();
					});
					document.getElementById("search").addEventListener("input", (e) => {
						state.search = e.target.value;
						renderListView();
					});
					window.addEventListener("resize", renderListView);

					initGlobe();
					renderListView();
				})
				.catch(function (err) {
					console.error("Failed to load CountryInfoforMap.csv:", err);
				});
		</script>
	</body>
</html>
