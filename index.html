<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<title>PIRLS 2026 Participants</title>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Raleway:ital,wght@0,100..900;1,100..900&display=swap"
			rel="stylesheet" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,wght@0,400;0,600;1,400&display=swap"
			rel="stylesheet" />
		<script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
		<style>
			:root {
				--dominant: #b83726;
			}
			* {
				box-sizing: border-box;
			}
			body {
				margin: 0;
				min-height: 100vh;
				font-family: "Source Serif 4", Georgia, serif;
				background: #fdfdfd;
				color: #333;
			}
			.header {
				display: flex;
				flex-direction: column;
				align-items: center;
				text-align: center;
				padding: 6px 24px 0;
				font-size: 1rem;
				font-family: "Lato", sans-serif;
				font-weight: 500;
				letter-spacing: 0.02em;
				color: #333;
			}
			.header .brand {
				color: var(--dominant);
				font-weight: 600;
				font-size: 1.5rem;
				padding-top: 20px;
			}
			#viz {
				width: 100%;
				height: calc(100vh - 130px);
				margin-top: 10px;
				user-select: none;
				-webkit-user-select: none;
			}
			#viz .node {
				cursor: grab;
			}
			#viz .node:active {
				cursor: grabbing;
			}
			#viz .card {
				transition: filter 1.5s;
			}
			#viz .node:hover .card {
				filter: brightness(0.97);
			}
			#filter-bar {
				display: flex;
				align-items: center;
				justify-content: center;
				gap: 8px;
				padding: 6px 24px 6px;
				flex-wrap: nowrap;
				max-width: 1100px;
				margin: 0 auto;
				overflow-x: auto;
				white-space: nowrap;
				user-select: none;
				-webkit-user-select: none;
			}
			#filter-bar label {
				font-size: 0.8rem;
				color: #555;
				white-space: nowrap;
			}
			#filter-bar select,
			#filter-bar input#search {
				padding: 4px 10px;
				border-radius: 7px;
				font-size: 0.8rem;
				border: 1px solid #e0e0e0;
				font-family: inherit;
				height: 30px;
				background: #fff;
				color: #333;
			}
			#filter-bar select {
				min-width: 140px;
				cursor: pointer;
			}
			#filter-bar select:focus,
			#filter-bar input#search:focus {
				outline: none;
				border-color: var(--dominant);
			}
			#filter-bar input#search {
				width: 160px;
			}
			.filter-sep {
				width: 1px;
				height: 18px;
				background: #ddd;
				margin: 0 4px;
				flex-shrink: 0;
			}
			.toggle-label {
				font-size: 0.8rem;
				color: #bbb;
				cursor: pointer;
				user-select: none;
				transition:
					color 0.15s,
					font-weight 0.15s;
			}
			.toggle-label.active {
				color: var(--dominant);
				font-weight: 600;
			}
			.toggle-switch {
				position: relative;
				display: inline-block;
				width: 38px;
				height: 20px;
				cursor: pointer;
			}
			.toggle-switch input {
				opacity: 0;
				width: 0;
				height: 0;
				position: absolute;
			}
			.toggle-rail {
				position: absolute;
				inset: 0;
				background: rgba(184, 55, 38, 0.1);
				border-radius: 10px;
				border: 1px solid rgba(184, 55, 38, 0.22);
			}
			.toggle-knob {
				position: absolute;
				top: 2px;
				left: 2px;
				width: 14px;
				height: 14px;
				background: var(--dominant);
				border-radius: 50%;
				transition: transform 0.22s ease;
			}
			.toggle-switch input:checked + .toggle-rail .toggle-knob {
				transform: translateX(18px);
			}
			#legend {
				max-width: 1100px;
				margin: 0 auto;
				padding: 2px 24px 6px;
				display: flex;
				justify-content: center;
			}
			#legend .legend-card {
				width: min(860px, 100%);
				padding: 8px 16px;
				border-radius: 12px;
				background: rgba(255, 250, 247, 0.92);
				border: 1px solid rgba(184, 55, 38, 0.18);
				box-shadow: 0 8px 24px rgba(37, 23, 19, 0.09);
				backdrop-filter: blur(10px);
				-webkit-backdrop-filter: blur(10px);
				font-size: 0.78rem;
				color: #5d4540;
				font-family: "Lato", sans-serif;
				letter-spacing: 0.01em;
				display: grid;
				grid-template-columns: 70px minmax(260px, 340px) minmax(0, 1fr);
				gap: 14px;
				align-items: center;
			}
			.legend-title {
				font-size: 0.72rem;
				font-weight: 700;
				letter-spacing: 0.12em;
				text-transform: uppercase;
				color: var(--dominant);
				margin-bottom: 0;
			}
			.legend-label {
				font-size: 0.76rem;
				font-weight: 700;
				color: black;
				margin-bottom: 8px;
			}
			.legend-shapes {
				display: grid;
				grid-template-columns: 1fr 1fr;
				gap: 14px;
			}
			.legend-shape-item {
				display: flex;
				align-items: center;
				gap: 10px;
			}
			.legend-shape {
				flex: 0 0 auto;
				border: 1px solid rgba(184, 55, 38, 0.22);
				background: #f2d0cb;
			}
			.legend-shape.circle {
				width: 22px;
				height: 22px;
				border-radius: 50%;
			}
			.legend-shape.card {
				width: 32px;
				height: 20px;
				border-radius: 5px;
			}
			.legend-copy {
				line-height: 1.35;
			}
			.legend-copy strong {
				display: block;
				font-size: 0.8rem;
				color: #362522;
			}
			.legend-scale {
				display: grid;
				grid-template-columns: repeat(6, 1fr);
				gap: 10px;
			}
			.legend-swatch-item {
				text-align: center;
			}
			.legend-swatch {
				height: 12px;
				border-radius: 999px;
				border: 1px solid rgba(184, 55, 38, 0.12);
				margin-bottom: 3px;
			}
			.legend-swatch-label {
				font-size: 0.68rem;
				color: #765d58;
			}
			@media (max-width: 640px) {
				#legend {
					padding: 0 12px 10px;
				}
				#legend .legend-card {
					width: 100%;
					padding: 12px 14px;
					grid-template-columns: 1fr;
					gap: 12px;
					align-items: start;
				}
				.legend-shapes {
					grid-template-columns: 1fr;
				}
				#participant-modal {
					padding: 12px;
				}
				#participant-modal .modal-header,
				#participant-modal .modal-body {
					padding-left: 16px;
					padding-right: 16px;
				}
				#participant-list {
					grid-template-columns: 1fr;
				}
			}
			#tooltip {
				position: fixed;
				left: 40%;
				right: 0;
				bottom: 0;
				width: 20%;
				pointer-events: none;
				z-index: 100;
				transform: translateY(100%);
				transition: transform 0.8s cubic-bezier(0.22, 1, 0.36, 1);
			}
			#tooltip.visible {
				transform: translateY(0);
			}
			#tooltip.visible .card {
				pointer-events: none;
			}
			#tooltip.visible.selected .card {
				pointer-events: auto;
			}
			#tooltip .card {
				width: 100%;
				min-height: 300px;
				transition: min-height 0.5s cubic-bezier(0.22, 1, 0.36, 1);
				background: #ffffff;
				backdrop-filter: blur(16px);
				-webkit-backdrop-filter: blur(16px);
				border-top: 1px solid rgba(184, 55, 38, 0.25);
				padding: 28px 48px 32px;
				box-shadow: 0 -8px 40px rgba(0, 0, 0, 0.08);
				box-sizing: border-box;
				border-radius: 60px 60px 0 0;
				display: flex;
				flex-direction: column;
				align-items: center;
				justify-content: flex-start;
				text-align: center;
			}
			#tooltip .card .coord-holder {
				margin-bottom: 12px;
				display: flex;
				flex-direction: column;
				align-items: center;
				gap: 5px;
			}
			#tooltip .card .coord-holder:empty {
				display: none;
			}
			#tooltip .card .coord-globe {
				width: 64px;
				height: 64px;
				filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.18));
				transition:
					width 0.4s ease,
					height 0.4s ease;
			}
			#tooltip.visible.selected .card .coord-globe {
				width: 90px;
				height: 90px;
			}
			#tooltip .card .coord-text {
				font-size: 0.7rem;
				color: #9a6b62;
				letter-spacing: 0.09em;
				font-family: "Raleway", sans-serif;
				font-weight: 600;
			}
			#tooltip .card .name {
				font-size: 1.4rem;
				font-weight: 600;
				color: #1a1a1a;
				margin-bottom: 8px;
				transition: font-size 0.4s ease;
			}
			#tooltip.visible.selected .card .name {
				font-size: 1.9rem;
			}
			#tooltip .card .cycles {
				font-size: 0.95rem;
				color: #555;
				margin-bottom: 8px;
				transition: font-size 0.4s ease;
			}
			#tooltip.visible.selected .card .cycles {
				font-size: 1.15rem;
			}
			#tooltip .card .languages {
				max-width: 560px;
				font-size: 0.92rem;
				line-height: 1.45;
				color: #5d4540;
				margin-bottom: 10px;
			}
			#tooltip.visible.selected .card .languages {
				font-size: 1rem;
			}
			#tooltip .link-holder {
				margin-top: 12px;
				width: 100%;
				max-width: 400px;
			}
			#tooltip .link-holder label {
				display: block;
				font-size: 0.8rem;
				color: var(--dominant);
				margin-bottom: 6px;
			}
			#tooltip .link-holder input {
				width: 100%;
				padding: 8px 10px;
				font-family: inherit;
				font-size: 0.9rem;
				border: 1px solid #ddd;
				border-radius: 6px;
				color: #333;
				background: #fff;
				box-sizing: border-box;
			}
			#tooltip .link-holder input::placeholder {
				color: #999;
			}
			#tooltip .link-holder input:focus {
				outline: none;
				border-color: var(--dominant);
			}
			#viz g.node.dimmed {
				opacity: 0.25;
				pointer-events: none;
			}
			#list-view {
				display: none;
				height: calc(100vh - 130px);
				overflow-x: auto;
				overflow-y: hidden;
				columns: 6;
				column-gap: 24px;
				padding: 8px 24px 0;
				max-width: 1200px;
				margin: 0 auto;
				box-sizing: border-box;
			}
			.alpha-section {
				margin-bottom: 10px;
				break-inside: avoid-column;
			}
			.alpha-letter {
				font-size: 1.2rem;
				font-weight: 700;
				letter-spacing: 0.15em;
				text-transform: uppercase;
				color: #b8a09a;
				padding: 8px 0 4px;
				margin-bottom: 2px;
				border-bottom: 1px solid rgba(184, 55, 38, 0.1);
				break-after: avoid;
			}
			.alpha-row {
				padding: 3px 6px;
				border-radius: 5px;
				break-inside: avoid;
				transition: background 0.12s;
			}
			.alpha-row:hover {
				background: rgba(184, 55, 38, 0.06);
			}
			.alpha-name {
				font-size: 0.88rem;
				font-weight: 600;
				color: #2a1a17;
				text-decoration: none;
				display: block;
				white-space: nowrap;
				overflow: hidden;
				text-overflow: ellipsis;
				transition: color 0.12s;
				line-height: 1.4;
			}
			.alpha-name:hover {
				color: var(--dominant);
			}
			.alpha-sub {
				font-size: 0.68rem;
				color: #9a8078;
				white-space: nowrap;
				overflow: hidden;
				text-overflow: ellipsis;
				line-height: 1.3;
				padding-bottom: 2px;
			}
			.alpha-empty {
				column-span: all;
				text-align: center;
				padding: 48px 0;
				color: #735a55;
				font-size: 0.95rem;
				width: 100%;
			}
		</style>
	</head>
	<body>
		<div class="header">
			<span class="brand">PIRLS 2026 Participants</span>
		</div>
		<div id="filter-bar">
			<label for="cycle-filter">Filter by Previous PIRLS Participation:</label>
			<select id="cycle-filter">
				<option value="all">All</option>
				<option value="P21">PIRLS 2021</option>
				<option value="P16">PIRLS 2016</option>
				<option value="P11">PIRLS 2011</option>
				<option value="P06">PIRLS 2006</option>
				<option value="P01">PIRLS 2001</option>
			</select>
			<label for="search">Search</label>
			<input type="text" id="search" placeholder="Country name..." />
			<span class="filter-sep"></span>
			<span class="toggle-label active" id="label-cluster">Cluster</span>
			<label class="toggle-switch">
				<input type="checkbox" id="layout-toggle" />
				<span class="toggle-rail"><span class="toggle-knob"></span></span>
			</label>
			<span class="toggle-label" id="label-list">List</span>
		</div>
		<div id="legend" aria-label="Chart legend">
			<div class="legend-card">
				<div class="legend-title">Legend</div>
				<div class="legend-section">
					<div class="legend-label">Shape = Number of PIRLS 2026 Assessment Languages</div>
					<div class="legend-shapes">
						<div class="legend-shape-item">
							<div class="legend-shape circle" aria-hidden="true"></div>
							<div class="legend-copy">1 language</div>
						</div>
						<div class="legend-shape-item">
							<div class="legend-shape card" aria-hidden="true"></div>
							<div class="legend-copy">2+ languages</div>
						</div>
					</div>
				</div>
				<div class="legend-section">
					<div class="legend-label">Color = Participation in Previous PIRLS Cycles</div>
					<div class="legend-scale">
						<div class="legend-swatch-item">
							<div class="legend-swatch" style="background: #fdf2f1"></div>
							<div class="legend-swatch-label">0</div>
						</div>
						<div class="legend-swatch-item">
							<div class="legend-swatch" style="background: #f9e4e1"></div>
							<div class="legend-swatch-label">1</div>
						</div>
						<div class="legend-swatch-item">
							<div class="legend-swatch" style="background: #f2d0cb"></div>
							<div class="legend-swatch-label">2</div>
						</div>
						<div class="legend-swatch-item">
							<div class="legend-swatch" style="background: #eab8b0"></div>
							<div class="legend-swatch-label">3</div>
						</div>
						<div class="legend-swatch-item">
							<div class="legend-swatch" style="background: #d99689"></div>
							<div class="legend-swatch-label">4</div>
						</div>
						<div class="legend-swatch-item">
							<div class="legend-swatch" style="background: #c76552"></div>
							<div class="legend-swatch-label">5</div>
						</div>
					</div>
				</div>
			</div>
		</div>
		<div id="viz-wrap">
			<div id="viz"></div>
		</div>
		<div id="list-view"></div>
		<div id="tooltip">
			<div class="card">
				<div class="coord-holder"></div>
				<div class="name"></div>
				<div class="cycles"></div>
				<div class="languages"></div>
				<div class="country-link"><a href="">Go to Country Chapter</a></div>
			</div>
		</div>

		<script>
			d3.csv("CountryInfoforMap.csv")
				.then(function (RAW) {
					function parse(r) {
						const cycles = [];
						if (r["Participated P21 "] === "X") cycles.push("P21");
						if (r["Participated P16"] === "X") cycles.push("P16");
						if (r["Participated P11"] === "X") cycles.push("P11");
						if (r["Participated P06"] === "X") cycles.push("P06");
						if (r["Participated P01"] === "X") cycles.push("P01");
						const langStr = (r["P26 Assessment Languages"] || "").trim();
						const languages = langStr ? langStr.split(/\s*,\s*/) : [];
						return {
							id: r.Country.replace(/\s+/g, "-").replace(/[(),]/g, ""),
							name: r.Country,
							cycles,
							cycleCount: cycles.length,
							languages,
							langCount: languages.length,
						};
					}

					const DATA = RAW.map((r) => ({ ...parse(r), _raw: r }));

					const COUNTRY_TO_COORDS = {
						Albania: [41.15, 20.17],
						Australia: [-25.27, 133.78],
						Austria: [47.52, 14.55],
						Azerbaijan: [40.14, 47.58],
						Bahrain: [26.03, 50.55],
						"Belgium (Flemish)": [51, 4.3],
						"Belgium (French)": [50.3, 4.45],
						Brazil: [-14.24, -51.93],
						Bulgaria: [42.73, 25.49],
						Canada: [56.13, -106.35],
						"Ontario, Canada": [50, -85],
						"Quebec, Canada": [52, -72],
						"Chinese Taipei": [23.7, 120.96],
						Cyprus: [35.13, 33.43],
						"Czech Republic": [49.82, 15.47],
						Denmark: [56.26, 9.5],
						England: [52.36, -1.17],
						Finland: [61.92, 25.75],
						France: [46.23, 2.21],
						Georgia: [42.32, 43.36],
						Germany: [51.17, 10.45],
						"Hong Kong SAR": [22.4, 114.11],
						Hungary: [47.16, 19.5],
						"Iran, Islamic Rep. of": [32.43, 53.69],
						Ireland: [53.41, -8.24],
						Israel: [31.05, 34.85],
						Italy: [41.87, 12.57],
						Jordan: [30.59, 36.24],
						Kazakhstan: [48.02, 66.92],
						"Korea, Rep. of": [35.91, 127.77],
						Kuwait: [29.31, 47.48],
						Latvia: [56.88, 24.6],
						Lithuania: [55.17, 23.88],
						"Macao SAR": [22.2, 113.54],
						Malta: [35.94, 14.38],
						Montenegro: [42.71, 19.37],
						Morocco: [31.79, -7.09],
						Netherlands: [52.13, 5.29],
						"New Zealand": [-40.9, 174.89],
						"North Macedonia": [41.61, 21.75],
						"Northern Ireland": [54.61, -6.69],
						Norway: [60.47, 8.47],
						Oman: [21.51, 55.92],
						Poland: [51.92, 19.15],
						Portugal: [39.4, -8.22],
						Qatar: [25.35, 51.18],
						Romania: [45.94, 24.97],
						"Saudi Arabia": [23.89, 45.08],
						"Saudi Arabia (RCJY)": [23.89, 45.08],
						Scotland: [56.49, -4.2],
						"South Africa": [-30.56, 22.94],
						Serbia: [44.02, 21.01],
						Singapore: [1.35, 103.82],
						"Slovak Republic": [48.67, 19.7],
						Slovenia: [46.15, 14.99],
						Spain: [40.46, -3.75],
						Sweden: [60.13, 18.64],
						Tajikistan: [38.86, 71.28],
						"United Arab Emirates": [23.42, 53.85],
						"Abu Dhabi, UAE": [24.47, 54.37],
						"Dubai, UAE": [25.2, 55.27],
						"Sharjah, UAE": [25.36, 55.39],
						Uzbekistan: [41.38, 64.59],
						Wales: [52.13, -3.78],
					};

					function makeGlobeSVG(lat, lon) {
						const r = 0.88;
						const DEG = Math.PI / 180;
						const φ0 = lat * DEG,
							λ0 = lon * DEG;

						function project(φ, λ) {
							const dλ = λ - λ0;
							const x = Math.cos(φ) * Math.sin(dλ);
							const y = Math.sin(φ) * Math.cos(φ0) - Math.cos(φ) * Math.sin(φ0) * Math.cos(dλ);
							const z = Math.sin(φ) * Math.sin(φ0) + Math.cos(φ) * Math.cos(φ0) * Math.cos(dλ);
							return [x * r, -y * r, z];
						}

						function makePath(pts) {
							let d = "",
								on = false;
							for (const [φ, λ] of pts) {
								const [px, py, z] = project(φ, λ);
								if (z >= 0) {
									d += (on ? "L" : "M") + px.toFixed(3) + "," + py.toFixed(3);
									on = true;
								} else on = false;
							}
							return d;
						}

						function gridPath(d, strong) {
							const a = strong ? 0.3 : 0.16,
								w = strong ? 0.038 : 0.018;
							return d ? `<path d="${d}" stroke="rgba(184,55,38,${a})" stroke-width="${w}" fill="none"/>` : "";
						}

						const latLines = [-60, -30, 0, 30, 60]
							.map((deg) => {
								const φ = deg * DEG;
								const pts = Array.from({ length: 121 }, (_, i) => [φ, (-180 + i * 3) * DEG]);
								return gridPath(makePath(pts), deg === 0);
							})
							.join("");

						const lonLines = [-3, -2, -1, 0, 1, 2]
							.map((k) => {
								const λ = λ0 + k * 60 * DEG;
								const pts = Array.from({ length: 61 }, (_, i) => [(-90 + i * 3) * DEG, λ]);
								return gridPath(makePath(pts), k === 0);
							})
							.join("");

						return `<svg class="coord-globe" viewBox="-1 -1 2 2" xmlns="http://www.w3.org/2000/svg">
							<defs><clipPath id="gc"><circle cx="0" cy="0" r="${r}"/></clipPath></defs>
							<circle cx="0" cy="0" r="${r}" fill="rgba(253,242,241,0.75)"/>
							<g clip-path="url(#gc)">${latLines}${lonLines}</g>
							<circle cx="0" cy="0" r="${r}" fill="none" stroke="rgba(184,55,38,0.45)" stroke-width="0.055"/>
							<circle cx="0" cy="0" r="0.13" fill="rgba(184,55,38,0.22)"/>
							<circle cx="0" cy="0" r="0.09" fill="#b83726"/>
						</svg>`;
					}

					function formatCoords(lat, lon) {
						const latDir = lat >= 0 ? "N" : "S";
						const lonDir = lon >= 0 ? "E" : "W";
						return Math.abs(lat).toFixed(1) + "° " + latDir + " · " + Math.abs(lon).toFixed(1) + "° " + lonDir;
					}

					let state = { cycleFilter: "all", selectedId: null, search: "", layoutMode: "cluster" };

					function escapeHtml(value) {
						return String(value ?? "").replace(/[&<>"']/g, (char) => {
							return {
								"&": "&amp;",
								"<": "&lt;",
								">": "&gt;",
								'"': "&quot;",
								"'": "&#39;",
							}[char];
						});
					}

					function filteredData() {
						let list = state.cycleFilter === "all" ? DATA : DATA.filter((d) => d.cycles.includes(state.cycleFilter));
						if (state.search.trim()) {
							const q = state.search.trim().toLowerCase();
							list = list.filter((d) => d.name.toLowerCase().includes(q));
						}
						return list;
					}

					function orderedTarget(i, w, h, total) {
						const cols = Math.max(4, Math.floor((w - 80) / 150));
						const rows = Math.max(1, Math.ceil(total / cols));
						const xGap = Math.max(110, Math.min(170, (w - 80) / cols));
						const yGap = Math.max(90, Math.min(135, (h - 80) / rows));
						const col = i % cols;
						const row = Math.floor(i / cols);
						return {
							x: 40 + xGap / 2 + col * xGap,
							y: 40 + yGap / 2 + row * yGap,
						};
					}

					const LANGUAGE_COLORS = ["#fdf2f1", "#f9e4e1", "#f2d0cb", "#eab8b0", "#d99689", "#c76552", "#b83726"];

					function fillFor(d) {
						const count = Math.max(0, d.cycleCount || 0);
						return LANGUAGE_COLORS[Math.min(count, LANGUAGE_COLORS.length - 1)];
					}

					const SHAPES = ["card", "circle"];
					function shapeFor(d) {
						const n = d.langCount || 0;
						if (n === 1) return "circle";
						return "card";
					}
					function nodeRadius(d) {
						const r = 28 + d.cycleCount * 1;
						return Math.max(r, 36);
					}
					function cardSize(d) {
						const base = 24;
						return { w: Math.max(95, 70) + base, h: base * 2.2 };
					}

					function splitLabel(text, maxCharsPerLine, maxLines) {
						const words = String(text || "")
							.split(/\s+/)
							.filter(Boolean);
						const lines = [];
						let current = "";

						words.forEach((word) => {
							const next = current ? current + " " + word : word;
							if (!current || next.length <= maxCharsPerLine) {
								current = next;
								return;
							}
							lines.push(current);
							current = word;
						});

						if (current) lines.push(current);
						if (!lines.length) lines.push(String(text || ""));
						return lines.slice(0, maxLines);
					}

					function drawNodeLabel(group, text, options) {
						const lines = splitLabel(text, options.maxCharsPerLine, options.maxLines);
						const textEl = group
							.append("text")
							.attr("text-anchor", "middle")
							.attr("dominant-baseline", "central")
							.style("font-size", options.fontSize + "px")
							.style("fill", "#0d0d0d")
							.style("font-weight", 700);

						const startY = -((lines.length - 1) * options.lineHeight) / 2;
						lines.forEach((line, i) => {
							textEl
								.append("tspan")
								.attr("x", 0)
								.attr("dy", i === 0 ? startY + "em" : options.lineHeight + "em")
								.text(line);
						});
					}

					let sim = null;

					const LIST_CYCLE_YEAR = { P01: "2001", P06: "2006", P11: "2011", P16: "2016", P21: "2021" };
					const LIST_FILLS = ["#fdf2f1", "#f9e4e1", "#f2d0cb", "#eab8b0", "#d99689", "#c76552", "#b83726"];
					const LIST_BORDERS = [
						"rgba(184,55,38,0.2)",
						"rgba(184,55,38,0.35)",
						"rgba(184,55,38,0.5)",
						"#c89088",
						"#b07060",
						"#9a5040",
						"#b83726",
					];

					function renderListView() {
						const listEl = document.getElementById("list-view");
						const list = filteredData().sort((a, b) => a.name.localeCompare(b.name));
						const maxCycles = d3.max(DATA, (d) => d.cycleCount) || 1;

						if (!list.length) {
							listEl.innerHTML = '<div class="alpha-empty">No countries match the current filter.</div>';
							return;
						}

						const groups = {};
						list.forEach((d) => {
							const letter = d.name[0].toUpperCase();
							if (!groups[letter]) groups[letter] = [];
							groups[letter].push(d);
						});

						listEl.innerHTML = Object.keys(groups)
							.sort()
							.map((letter) => {
								const rows = groups[letter]
									.map((d) => {
										const langs = d.languages.length ? d.languages.join(", ") : "—";
										const years = d.cycles.length ? d.cycles.map((c) => LIST_CYCLE_YEAR[c] || c).join(", ") : "New";
										return `<div class="alpha-row"><a class="alpha-name" href="#">${escapeHtml(d.name)}</a><div class="alpha-sub">${escapeHtml(years)} </div></div>`;
									})
									.join("");
								return `<div class="alpha-section"><div class="alpha-letter">${letter}</div>${rows}</div>`;
							})
							.join("");
					}

					function runViz() {
						const vizWrap = document.getElementById("viz-wrap");
						const listEl = document.getElementById("list-view");
						if (state.layoutMode === "alpha") {
							if (sim) {
								sim.stop();
								sim = null;
							}
							document.getElementById("tooltip").classList.remove("visible", "selected");
							document.getElementById("legend").style.display = "none";
							vizWrap.style.display = "none";
							listEl.style.display = "block";
							renderListView();
							return;
						}
						if (sim) {
							sim.stop();
							sim = null;
						}
						document.getElementById("legend").style.display = "";
						vizWrap.style.display = "";
						listEl.style.display = "none";

						const el = document.getElementById("viz");
						const w = Math.max(el.clientWidth || 800, 400);
						const h = Math.max(el.clientHeight || 500, 300);
						const list = filteredData();

						if (!list.length) {
							d3.select("#viz").selectAll("*").remove();
							const svg = d3.select("#viz").append("svg").attr("width", w).attr("height", h);
							svg.append("text")
								.attr("x", w / 2)
								.attr("y", h / 2)
								.attr("text-anchor", "middle")
								.attr("dominant-baseline", "central")
								.style("font-size", "0.95rem")
								.style("fill", "#735a55")
								.style("font-family", '"Source Serif 4", Georgia, serif')
								.text("No countries match the current filter.");
							return;
						}

						const nodes = list.map((d) => {
							const shape = shapeFor(d);
							const r = nodeRadius(d);
							const cs = cardSize(d);
							return {
								...d,
								shape,
								radius: shape === "card" ? Math.max(cs.w, cs.h) / 2 + 1 : r + 1,
								cardW: cs.w,
								cardH: cs.h,
								radiusCircle: r,
								x: w / 2 + (Math.random() - 0.5) * w * 0.5,
								y: h / 2 + (Math.random() - 0.5) * h * 0.5,
							};
						});

						d3.select("#viz").selectAll("*").remove();
						const svg = d3.select("#viz").append("svg").attr("width", w).attr("height", h);
						svg.append("rect").attr("class", "viz-bg").attr("width", w).attr("height", h).attr("fill", "transparent");

						const g = svg
							.selectAll("g.node")
							.data(nodes)
							.join("g")
							.attr("class", "node")
							.attr("transform", (d) => "translate(" + d.x + "," + d.y + ")");

						g.each(function (d) {
							const sel = d3.select(this);
							const g2 = sel.append("g").attr("class", "card");
							if (d.shape === "circle") {
								g2.append("circle")
									.attr("r", d.radiusCircle)
									.attr("fill", fillFor(d))
									.attr("stroke", "rgba(184,55,38,0.2)")
									.attr("stroke-width", 1);
								drawNodeLabel(g2, d.name, { fontSize: 12, maxCharsPerLine: 9, maxLines: 3, lineHeight: 1.05 });
							} else {
								const w2 = d.cardW / 2;
								const h2 = d.cardH / 2;
								g2.append("rect")
									.attr("x", -w2)
									.attr("y", -h2)
									.attr("width", d.cardW)
									.attr("height", d.cardH)
									.attr("rx", 8)
									.attr("ry", 8)
									.attr("fill", fillFor(d))
									.attr("stroke", "rgba(184,55,38,0.2)")
									.attr("stroke-width", 1);
								drawNodeLabel(g2, d.name, { fontSize: 12, maxCharsPerLine: 16, maxLines: 2, lineHeight: 1.05 });
							}
						});

						const tooltip = document.getElementById("tooltip");
						const ttName = tooltip.querySelector(".name");
						const ttCycles = tooltip.querySelector(".cycles");
						const ttLanguages = tooltip.querySelector(".languages");

						const TOOLTIP_CYCLE_YEAR = {
							P01: "2001",
							P06: "2006",
							P11: "2011",
							P16: "2016",
							P21: "2021",
						};
						function showTooltip(d, isSelected) {
							ttName.textContent = d.name;
							const yearsLabel = d.cycles.length ? d.cycles.map((c) => TOOLTIP_CYCLE_YEAR[c] || c).join(", ") : "—";
							ttCycles.textContent = "Previous Participation: " + yearsLabel;
							ttLanguages.textContent =
								"PIRLS 2026 Assessment Languages: " +
								(d.languages && d.languages.length ? d.languages.join(", ") : "—");
							const coordEl = tooltip.querySelector(".coord-holder");
							const coords = COUNTRY_TO_COORDS[d.name];
							if (coords) {
								const [lat, lon] = coords;
								coordEl.innerHTML =
									makeGlobeSVG(lat, lon) + '<div class="coord-text">' + formatCoords(lat, lon) + "</div>";
							} else {
								coordEl.innerHTML = "";
							}
							tooltip.classList.add("visible");
							tooltip.classList.toggle("selected", !!isSelected);
						}

						g.on("mouseover", function (e, d) {
							showTooltip(d, !!state.selectedId);
						})
							.on("mouseout", () => {
								if (!state.selectedId) tooltip.classList.remove("visible");
								else {
									const sel = DATA.find((r) => r.id === state.selectedId);
									if (sel) showTooltip(sel, true);
								}
							})
							.on("click", (e, d) => {
								e.stopPropagation();
								state.selectedId = state.selectedId === d.id ? null : d.id;
								g.classed("dimmed", (n) => state.selectedId !== null && n.id !== state.selectedId);
								g.classed("selected", (n) => n.id === state.selectedId);
								if (state.selectedId) {
									const sel = DATA.find((r) => r.id === state.selectedId);
									showTooltip(sel, true);
								} else {
									tooltip.classList.remove("visible", "selected");
									g.classed("selected", false);
								}
							});

						const drag = d3
							.drag()
							.on("start", (e, d) => {
								e.sourceEvent.preventDefault();
								if (!e.active) sim.alphaTarget(0.3).restart();
								d.fx = d.x;
								d.fy = d.y;
							})
							.on("drag", (e, d) => {
								d.fx = e.x;
								d.fy = e.y;
							})
							.on("end", (e, d) => {
								if (!e.active) sim.alphaTarget(0);
								d.fx = null;
								d.fy = null;
							});
						g.call(drag);

						sim = d3
							.forceSimulation(nodes)
							.velocityDecay(0.6)
							.alphaDecay(0.04)
							.force(
								"collide",
								d3
									.forceCollide()
									.radius((d) => d.radius)
									.iterations(2),
							)
							.force("x", d3.forceX(w / 2).strength(0.02))
							.force("y", d3.forceY(h / 2.2).strength(0.1))
							.on("tick", () => {
								g.attr("transform", (d) => {
									d.x = Math.max(d.radius, Math.min(w - d.radius, d.x));
									d.y = Math.max(d.radius, Math.min(h - d.radius, d.y));
									const s = d.id === state.selectedId ? 1.2 : 1;
									return "translate(" + d.x + "," + d.y + ")" + (s > 1 ? " scale(" + s + ")" : "");
								});
							});

						svg.on("click", function (e) {
							if (e.target === this || d3.select(e.target).classed("viz-bg")) {
								state.selectedId = null;
								g.classed("dimmed", false);
								g.classed("selected", false);
								tooltip.classList.remove("visible", "selected");
							}
						});
					}

					document.getElementById("cycle-filter").addEventListener("change", (e) => {
						state.cycleFilter = e.target.value;
						state.selectedId = null;
						runViz();
					});

					document.getElementById("search").addEventListener("input", (e) => {
						state.search = e.target.value;
						state.selectedId = null;
						runViz();
					});

					const layoutToggle = document.getElementById("layout-toggle");
					const labelCluster = document.getElementById("label-cluster");
					const labelList = document.getElementById("label-list");
					function syncToggleLabels() {
						const isList = state.layoutMode === "alpha";
						labelCluster.classList.toggle("active", !isList);
						labelList.classList.toggle("active", isList);
					}
					layoutToggle.addEventListener("change", () => {
						state.layoutMode = layoutToggle.checked ? "alpha" : "cluster";
						syncToggleLabels();
						runViz();
					});
					labelCluster.addEventListener("click", () => {
						if (layoutToggle.checked) {
							layoutToggle.checked = false;
							layoutToggle.dispatchEvent(new Event("change"));
						}
					});
					labelList.addEventListener("click", () => {
						if (!layoutToggle.checked) {
							layoutToggle.checked = true;
							layoutToggle.dispatchEvent(new Event("change"));
						}
					});

					window.addEventListener("resize", () => runViz());
					runViz();
				})
				.catch(function (err) {
					console.error("Failed to load CountryInfoforMap.csv:", err);
				});
		</script>
	</body>
</html>
