<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<title>Participation Overview</title>

		<style>
			body {
				margin: 0;
				background: #f5f5f7;
				font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
				overflow: hidden;
			}

			.container {
				position: relative;
				width: 100vw;
				height: 100vh;
			}

			/* CENTER TEXT */
			.statement {
				position: absolute;
				top: 50%;
				left: 50%;
				transform: translate(-50%, -50%);
				text-align: center;
				max-width: 700px;
				font-size: 42px;
				font-weight: 600;
				line-height: 1.2;
				transition: opacity 0.3s ease;
			}

			.sub {
				font-size: 20px;
				font-weight: 400;
				margin-top: 18px;
				color: #555;
			}

			/* FLAG RING */
			.flag-wrapper {
				position: absolute;
				text-align: center;
				transform: translate(-50%, -50%);
				cursor: pointer;
				transition: transform 0.3s ease;
			}

			.flag-wrapper:hover {
				transform: translate(-50%, -50%) scale(1.15);
			}

			.flag {
				width: 70px;
				height: 46px;
				object-fit: cover;
				border-radius: 6px;
				box-shadow: 0 4px 14px rgba(0, 0, 0, 0.08);
			}

			.tooltip {
				font-size: 12px;
				margin-top: 6px;
				opacity: 0;
				transition: opacity 0.2s ease;
			}

			.flag-wrapper:hover .tooltip {
				opacity: 1;
			}
		</style>
	</head>
	<body>
		<div class="container" id="container">
			<div class="statement" id="statement">
				Participating Countries
				<div class="sub">Click a flag to explore details.</div>
			</div>
		</div>

		<script>
			const countries = [
				{ name: "Finland", code: "fi", cycles: 8, languages: ["Finnish", "Swedish"] },
				{ name: "Japan", code: "jp", cycles: 8, languages: ["Japanese"] },
				{ name: "Canada", code: "ca", cycles: 6, languages: ["English", "French"] },
				{ name: "Brazil", code: "br", cycles: 5, languages: ["Portuguese"] },
				{ name: "France", code: "fr", cycles: 7, languages: ["French"] },
				{ name: "Morocco", code: "ma", cycles: 3, languages: ["Arabic", "French"] },
				{ name: "Spain", code: "es", cycles: 6, languages: ["Spanish"] },
				{ name: "Germany", code: "de", cycles: 6, languages: ["German"] },
				{ name: "Australia", code: "au", cycles: 7, languages: ["English"] },
				{ name: "South Korea", code: "kr", cycles: 8, languages: ["Korean"] },
				{ name: "Italy", code: "it", cycles: 6, languages: ["Italian"] },
				{ name: "Sweden", code: "se", cycles: 7, languages: ["Swedish"] },
			];

			const container = document.getElementById("container");
			const statement = document.getElementById("statement");

			const centerX = window.innerWidth / 2;
			const centerY = window.innerHeight / 2;
			const radius = Math.min(window.innerWidth, window.innerHeight) / 2.5;

			countries.forEach((country, i) => {
				const angle = (i / countries.length) * (2 * Math.PI);

				const x = centerX + radius * Math.cos(angle);
				const y = centerY + radius * Math.sin(angle);

				const wrapper = document.createElement("div");
				wrapper.classList.add("flag-wrapper");
				wrapper.style.left = `${x}px`;
				wrapper.style.top = `${y}px`;

				const img = document.createElement("img");
				img.src = `https://flagcdn.com/w160/${country.code}.png`;
				img.classList.add("flag");
				img.alt = country.name;

				const tooltip = document.createElement("div");
				tooltip.classList.add("tooltip");
				tooltip.textContent = country.name;

				wrapper.appendChild(img);
				wrapper.appendChild(tooltip);

				wrapper.addEventListener("click", () => {
					const langText =
						country.languages.length > 1 ?
							country.languages.slice(0, -1).join(", ") + " and " + country.languages.slice(-1)
						:	country.languages[0];

					statement.style.opacity = 0;

					setTimeout(() => {
						statement.innerHTML = `${country.name} participates ${country.cycles} times.
         <div class="sub">They speak ${langText}.</div>`;
						statement.style.opacity = 1;
					}, 200);
				});

				container.appendChild(wrapper);
			});
		</script>
	</body>
</html>
