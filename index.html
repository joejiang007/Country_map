<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<title>PIRLS 2026 Participants</title>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Raleway:ital,wght@0,100..900;1,100..900&display=swap"
			rel="stylesheet" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,wght@0,400;0,600;1,400&display=swap"
			rel="stylesheet" />
		<script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
		<style>
			:root {
				--dominant: #b83726;
			}
			* {
				box-sizing: border-box;
			}
			body {
				margin: 0;
				min-height: 100vh;
				font-family: "Source Serif 4", Georgia, serif;
				background: #fdfdfd;
				color: #333;
			}
			.header {
				display: flex;
				flex-direction: column;
				align-items: center;
				text-align: center;
				padding: 12px 24px 0;
				font-size: 1.2rem;
				font-family: "Lato", sans-serif;
				font-weight: 500;
				letter-spacing: 0.02em;
				color: #333;
			}
			.header .brand {
				font-family: "Lora", serif;
				color: var(--dominant);
				font-weight: 600;
				font-size: 2rem;
			}
			#viz {
				width: 100%;
				height: calc(100vh - 130px);
			}
			#viz .node {
				cursor: grab;
			}
			#viz .node:active {
				cursor: grabbing;
			}
			#viz .card {
				transition: filter 1.5s;
			}
			#viz .node:hover .card {
				filter: brightness(0.97);
			}
			#filter-bar {
				display: flex;
				align-items: center;
				justify-content: center;
				gap: 10px;
				padding: 10px 24px 12px;
				flex-wrap: nowrap;
				max-width: 1100px;
				margin: 0 auto;
				overflow-x: auto;
				white-space: nowrap;
			}
			#filter-bar label {
				font-size: 0.85rem;
				color: #555;
				white-space: nowrap;
			}
			#filter-bar select,
			#filter-bar input#search,
			#filter-bar button {
				padding: 6px 14px;
				border-radius: 8px;
				font-size: 0.85rem;
				border: 1px solid #e0e0e0;
				font-family: inherit;
				height: 36px;
			}
			#filter-bar select,
			#filter-bar input#search {
				background: #fff;
				color: #333;
			}
			#filter-bar select {
				min-width: 150px;
				cursor: pointer;
			}
			#filter-bar select:focus,
			#filter-bar input#search:focus {
				outline: none;
				border-color: var(--dominant);
			}
			#filter-bar input#search {
				padding: 6px 12px;
				width: 180px;
			}
			#filter-bar button {
				cursor: pointer;
				background: #f0f0f0;
				color: #555;
				transition: all 0.15s;
				flex: 0 0 auto;
			}
			#filter-bar button:hover {
				background: #e8e8e8;
				color: #222;
			}
			#filter-bar button.on {
				background: rgba(184, 55, 38, 0.12);
				color: var(--dominant);
				border-color: rgba(184, 55, 38, 0.35);
			}
			#legend {
				max-width: 1100px;
				margin: 0 auto;
				padding: 4px 24px 14px;
				display: flex;
				justify-content: center;
			}
			#legend .legend-card {
				width: min(860px, 100%);
				padding: 16px 20px;
				border-radius: 18px;
				background: rgba(255, 250, 247, 0.92);
				border: 1px solid rgba(184, 55, 38, 0.18);
				box-shadow: 0 16px 36px rgba(37, 23, 19, 0.12);
				backdrop-filter: blur(10px);
				-webkit-backdrop-filter: blur(10px);
				font-size: 0.82rem;
				color: #5d4540;
				font-family: "Lato", sans-serif;
				letter-spacing: 0.01em;
				display: grid;
				grid-template-columns: 90px minmax(300px, 360px) minmax(0, 1fr);
				gap: 22px;
				align-items: center;
			}
			.legend-title {
				font-size: 0.72rem;
				font-weight: 700;
				letter-spacing: 0.12em;
				text-transform: uppercase;
				color: var(--dominant);
				margin-bottom: 0;
			}
			.legend-label {
				font-size: 0.76rem;
				font-weight: 700;
				color: black;
				margin-bottom: 8px;
			}
			.legend-shapes {
				display: grid;
				grid-template-columns: 1fr 1fr;
				gap: 14px;
			}
			.legend-shape-item {
				display: flex;
				align-items: center;
				gap: 10px;
			}
			.legend-shape {
				flex: 0 0 auto;
				border: 1px solid rgba(184, 55, 38, 0.22);
				background: #f2d0cb;
			}
			.legend-shape.circle {
				width: 32px;
				height: 32px;
				border-radius: 50%;
			}
			.legend-shape.card {
				width: 46px;
				height: 30px;
				border-radius: 8px;
			}
			.legend-copy {
				line-height: 1.35;
			}
			.legend-copy strong {
				display: block;
				font-size: 0.8rem;
				color: #362522;
			}
			.legend-scale {
				display: grid;
				grid-template-columns: repeat(6, 1fr);
				gap: 10px;
			}
			.legend-swatch-item {
				text-align: center;
			}
			.legend-swatch {
				height: 16px;
				border-radius: 999px;
				border: 1px solid rgba(184, 55, 38, 0.12);
				margin-bottom: 4px;
			}
			.legend-swatch-label {
				font-size: 0.68rem;
				color: #765d58;
			}
			#participant-modal {
				position: fixed;
				inset: 0;
				display: flex;
				align-items: center;
				justify-content: center;
				padding: 24px;
				background: rgba(37, 23, 19, 0.35);
				backdrop-filter: blur(8px);
				-webkit-backdrop-filter: blur(8px);
				z-index: 200;
				opacity: 0;
				pointer-events: none;
				transition: opacity 0.2s ease;
			}
			#participant-modal.open {
				opacity: 1;
				pointer-events: auto;
			}
			#participant-modal .modal-card {
				width: min(1000px, 100%);
				max-height: min(80vh, 820px);
				overflow: hidden;
				background: linear-gradient(180deg, #fffdfa 0%, #f8f1ec 100%);
				border: 1px solid rgba(184, 55, 38, 0.16);
				border-radius: 24px;
				box-shadow: 0 24px 80px rgba(37, 23, 19, 0.18);
				display: flex;
				flex-direction: column;
			}
			#participant-modal .modal-header {
				display: flex;
				align-items: flex-start;
				justify-content: space-between;
				gap: 16px;
				padding: 22px 24px 16px;
				border-bottom: 1px solid rgba(184, 55, 38, 0.12);
			}
			#participant-modal .modal-title {
				font-size: 1.35rem;
				font-weight: 700;
				color: #221917;
			}
			#participant-modal .modal-subtitle {
				margin-top: 4px;
				font-size: 0.92rem;
				color: #735a55;
			}
			#participant-modal .close-modal {
				flex: 0 0 auto;
				width: 38px;
				height: 38px;
				border: none;
				border-radius: 999px;
				background: rgba(184, 55, 38, 0.08);
				color: var(--dominant);
				font-size: 1.4rem;
				line-height: 1;
				cursor: pointer;
			}
			#participant-modal .close-modal:hover {
				background: rgba(184, 55, 38, 0.14);
			}
			#participant-modal .modal-body {
				padding: 10px 24px 24px;
				overflow: auto;
			}
			#participant-list {
				display: grid;
				grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
				gap: 14px;
			}
			.participant-item {
				padding: 16px 18px;
				border-radius: 16px;
				background: rgba(255, 255, 255, 0.82);
				border: 1px solid rgba(184, 55, 38, 0.12);
			}
			.participant-name {
				font-size: 1rem;
				font-weight: 700;
				margin-bottom: 10px;
			}
			.participant-name a {
				color: #241714;
				text-decoration: none;
				border-bottom: 1px solid rgba(184, 55, 38, 0.25);
				transition:
					color 0.15s ease,
					border-color 0.15s ease;
			}
			.participant-name a:hover {
				color: var(--dominant);
				border-color: rgba(184, 55, 38, 0.6);
			}
			.participant-section {
				margin-bottom: 10px;
			}
			.participant-section:last-child {
				margin-bottom: 0;
			}
			.participant-label {
				font-size: 0.68rem;
				font-weight: 700;
				text-transform: uppercase;
				letter-spacing: 0.09em;
				color: #6b5752;
				margin-bottom: 4px;
			}
			.participant-meta {
				display: flex;
				align-items: center;
				justify-content: space-between;
				gap: 12px;
				font-size: 0.82rem;
				color: #453634;
				font-weight: 600;
			}
			.participant-dots {
				display: inline-flex;
				gap: 5px;
				flex-wrap: wrap;
			}
			.participant-dots span {
				width: 10px;
				height: 10px;
				border-radius: 50%;
				background: rgba(184, 55, 38, 0.22);
			}
			.participant-dots span.on {
				background: var(--dominant);
			}
			.participant-years {
				font-size: 0.82rem;
				line-height: 1.4;
				color: #6b5752;
				margin-top: 2px;
			}
			.participant-languages {
				font-size: 0.82rem;
				line-height: 1.4;
				color: #453634;
				font-weight: 600;
			}
			.participant-empty {
				padding: 24px;
				text-align: center;
				color: #735a55;
				font-size: 0.95rem;
			}
			@media (max-width: 640px) {
				#legend {
					padding: 0 12px 10px;
				}
				#legend .legend-card {
					width: 100%;
					padding: 12px 14px;
					grid-template-columns: 1fr;
					gap: 12px;
					align-items: start;
				}
				.legend-shapes {
					grid-template-columns: 1fr;
				}
				#participant-modal {
					padding: 12px;
				}
				#participant-modal .modal-header,
				#participant-modal .modal-body {
					padding-left: 16px;
					padding-right: 16px;
				}
				#participant-list {
					grid-template-columns: 1fr;
				}
			}
			#tooltip {
				position: fixed;
				left: 40%;
				right: 0;
				bottom: 0;
				width: 20%;
				pointer-events: none;
				z-index: 100;
				transform: translateY(100%);
				transition: transform 0.8s cubic-bezier(0.22, 1, 0.36, 1);
			}
			#tooltip.visible {
				transform: translateY(0);
			}
			#tooltip.visible .card {
				pointer-events: none;
			}
			#tooltip.visible.selected .card {
				pointer-events: auto;
				min-height: 50vh;
			}
			#tooltip .card {
				width: 100%;
				min-height: 300px;
				transition: min-height 0.5s cubic-bezier(0.22, 1, 0.36, 1);
				background: #ffffff;
				backdrop-filter: blur(16px);
				-webkit-backdrop-filter: blur(16px);
				border-top: 1px solid rgba(184, 55, 38, 0.25);
				padding: 28px 48px 32px;
				box-shadow: 0 -8px 40px rgba(0, 0, 0, 0.08);
				box-sizing: border-box;
				border-radius: 60px 60px 0 0;
				display: flex;
				flex-direction: column;
				align-items: center;
				justify-content: center;
				text-align: center;
			}
			#tooltip .card .flag-holder {
				margin-bottom: 12px;
				min-height: 0;
			}
			#tooltip .card .flag-holder:empty {
				display: none;
			}
			#tooltip .card .flag-holder img {
				width: 64px;
				height: auto;
				border-radius: 4px;
				box-shadow: 3px 10px 10px rgba(0, 0, 0, 0.4);
			}
			#tooltip.visible.selected .card .flag-holder img {
				width: 88px;
				height: auto;
			}
			#tooltip .card .name {
				font-size: 1.4rem;
				font-weight: 600;
				color: #1a1a1a;
				margin-bottom: 8px;
				transition: font-size 0.4s ease;
			}
			#tooltip.visible.selected .card .name {
				font-size: 1.9rem;
			}
			#tooltip .card .cycles {
				font-size: 0.95rem;
				color: #555;
				margin-bottom: 8px;
				transition: font-size 0.4s ease;
			}
			#tooltip.visible.selected .card .cycles {
				font-size: 1.15rem;
			}
			#tooltip .card .languages {
				max-width: 560px;
				font-size: 0.92rem;
				line-height: 1.45;
				color: #5d4540;
				margin-bottom: 10px;
			}
			#tooltip.visible.selected .card .languages {
				font-size: 1rem;
			}
			#tooltip .link-holder {
				margin-top: 12px;
				width: 100%;
				max-width: 400px;
			}
			#tooltip .link-holder label {
				display: block;
				font-size: 0.8rem;
				color: var(--dominant);
				margin-bottom: 6px;
			}
			#tooltip .link-holder input {
				width: 100%;
				padding: 8px 10px;
				font-family: inherit;
				font-size: 0.9rem;
				border: 1px solid #ddd;
				border-radius: 6px;
				color: #333;
				background: #fff;
				box-sizing: border-box;
			}
			#tooltip .link-holder input::placeholder {
				color: #999;
			}
			#tooltip .link-holder input:focus {
				outline: none;
				border-color: var(--dominant);
			}
			#viz g.node.dimmed {
				opacity: 0.25;
				pointer-events: none;
			}
			#list-view {
				display: none;
				height: calc(100vh - 130px);
				overflow: hidden;
				columns: 4;
				column-gap: 32px;
				padding: 8px 48px 0;
				max-width: 1200px;
				margin: 0 auto;
				box-sizing: border-box;
			}
			.alpha-section {
				margin-bottom: 10px;
				break-inside: avoid-column;
			}
			.alpha-letter {
				font-size: 0.68rem;
				font-weight: 700;
				letter-spacing: 0.14em;
				text-transform: uppercase;
				color: #b8a09a;
				padding: 10px 0 5px;
				margin-bottom: 2px;
				border-bottom: 1px solid rgba(184, 55, 38, 0.1);
				break-after: avoid;
			}
			.alpha-row {
				padding: 4px 0;
				break-inside: avoid;
			}
			.alpha-name {
				font-size: 0.92rem;
				font-weight: 500;
				color: #2a1a17;
				text-decoration: none;
				display: block;
				white-space: nowrap;
				overflow: hidden;
				text-overflow: ellipsis;
				padding: 2px 6px;
				border-radius: 4px;
				transition: background 0.12s, color 0.12s;
			}
			.alpha-name:hover {
				background: rgba(184, 55, 38, 0.07);
				color: var(--dominant);
			}
			.alpha-empty {
				padding: 32px;
				text-align: center;
				color: #735a55;
				font-size: 0.95rem;
			}
		</style>
	</head>
	<body>
		<div class="header">
			<span class="brand">PIRLS 2026 Participants</span>
		</div>
		<div id="filter-bar">
			<label for="cycle-filter">Filter by Previous PIRLS Participation:</label>
			<select id="cycle-filter">
				<option value="all">All</option>
				<option value="P21">PIRLS 2021</option>
				<option value="P16">PIRLS 2016</option>
				<option value="P11">PIRLS 2011</option>
				<option value="P06">PIRLS 2006</option>
				<option value="P01">PIRLS 2001</option>
			</select>
			<button id="participant-list-toggle" type="button">Participant List</button>
			<button id="layout-toggle" type="button">Cluster View</button>


			<label for="search">Search</label>
			<input type="text" id="search" placeholder="Country name..." />
		</div>
		<div id="legend" aria-label="Chart legend">
			<div class="legend-card">
				<div class="legend-title">Legend</div>
				<div class="legend-section">
					<div class="legend-label">Shape = Number of PIRLS 2026 Assessment Languages</div>
					<div class="legend-shapes">
						<div class="legend-shape-item">
							<div class="legend-shape circle" aria-hidden="true"></div>
							<div class="legend-copy">1 language</div>
						</div>
						<div class="legend-shape-item">
							<div class="legend-shape card" aria-hidden="true"></div>
							<div class="legend-copy">2+ languages</div>
						</div>
					</div>
				</div>
				<div class="legend-section">
					<div class="legend-label">Color = Participation in Previous PIRLS Cycles</div>
					<div class="legend-scale">
						<div class="legend-swatch-item">
							<div class="legend-swatch" style="background: #fdf2f1"></div>
							<div class="legend-swatch-label">0</div>
						</div>
						<div class="legend-swatch-item">
							<div class="legend-swatch" style="background: #f9e4e1"></div>
							<div class="legend-swatch-label">1</div>
						</div>
						<div class="legend-swatch-item">
							<div class="legend-swatch" style="background: #f2d0cb"></div>
							<div class="legend-swatch-label">2</div>
						</div>
						<div class="legend-swatch-item">
							<div class="legend-swatch" style="background: #eab8b0"></div>
							<div class="legend-swatch-label">3</div>
						</div>
						<div class="legend-swatch-item">
							<div class="legend-swatch" style="background: #d99689"></div>
							<div class="legend-swatch-label">4</div>
						</div>
						<div class="legend-swatch-item">
							<div class="legend-swatch" style="background: #c76552"></div>
							<div class="legend-swatch-label">5</div>
						</div>
					</div>
				</div>
			</div>
		</div>
		<div id="viz-wrap">
			<div id="viz"></div>
		</div>
		<div id="list-view"></div>
		<div id="participant-modal" aria-hidden="true">
			<div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="participant-modal-title">
				<div class="modal-header">
					<div>
						<div class="modal-title" id="participant-modal-title">Participant Countries</div>
						<div class="modal-subtitle" id="participant-modal-subtitle">Alphabetical list of current participants</div>
					</div>
					<button class="close-modal" type="button" aria-label="Close participant list">&times;</button>
				</div>
				<div class="modal-body">
					<div id="participant-list"></div>
				</div>
			</div>
		</div>
		<div id="tooltip">
			<div class="card">
				<div class="flag-holder"></div>
				<div class="name"></div>
				<div class="cycles"></div>
				<div class="languages"></div>
				<div class="country-link"><a href="">Go to Country Chapter</a></div>
			</div>
		</div>

		<script>
			d3.csv("CountryInfoforMap.csv")
				.then(function (RAW) {
					function parse(r) {
						const cycles = [];
						if (r["Participated P21 "] === "X") cycles.push("P21");
						if (r["Participated P16"] === "X") cycles.push("P16");
						if (r["Participated P11"] === "X") cycles.push("P11");
						if (r["Participated P06"] === "X") cycles.push("P06");
						if (r["Participated P01"] === "X") cycles.push("P01");
						const langStr = (r["P26 Assessment Languages"] || "").trim();
						const languages = langStr ? langStr.split(/\s*,\s*/) : [];
						return {
							id: r.Country.replace(/\s+/g, "-").replace(/[(),]/g, ""),
							name: r.Country,
							cycles,
							cycleCount: cycles.length,
							languages,
							langCount: languages.length,
						};
					}

					const DATA = RAW.map((r) => ({ ...parse(r), _raw: r }));

					const COUNTRY_TO_ISO = {
						Albania: "al",
						Austria: "at",
						Australia: "au",
						Azerbaijan: "az",
						Bahrain: "bh",
						"Belgium (Flemish)": "be",
						"Belgium (French)": "be",
						Brazil: "br",
						Bulgaria: "bg",
						Canada: "ca",
						"Ontario, Canada": "ca",
						"Quebec, Canada": "ca",
						"Chinese Taipei": "tw",
						Cyprus: "cy",
						"Czech Republic": "cz",
						Denmark: "dk",
						England: "gb",
						Finland: "fi",
						France: "fr",
						Georgia: "ge",
						Germany: "de",
						"Hong Kong SAR": "hk",
						Hungary: "hu",
						"Iran, Islamic Rep. of": "ir",
						Ireland: "ie",
						Israel: "il",
						Italy: "it",
						Jordan: "jo",
						Kazakhstan: "kz",
						"Korea, Rep. of": "kr",
						Kuwait: "kw",
						Latvia: "lv",
						Lithuania: "lt",
						"Macao SAR": "mo",
						Malta: "mt",
						Montenegro: "me",
						Morocco: "ma",
						Netherlands: "nl",
						"New Zealand": "nz",
						"North Macedonia": "mk",
						"Northern Ireland": "gb",
						Norway: "no",
						Oman: "om",
						Poland: "pl",
						Portugal: "pt",
						Qatar: "qa",
						Romania: "ro",
						"Saudi Arabia": "sa",
						"Saudi Arabia (RCJY)": "sa",
						Scotland: "gb-sct",
						"South Africa": "za",
						Serbia: "rs",
						Singapore: "sg",
						"Slovak Republic": "sk",
						Slovenia: "si",
						Spain: "es",
						Sweden: "se",
						Tajikistan: "tj",
						"United Arab Emirates": "ae",
						"Abu Dhabi, UAE": "ae",
						"Dubai, UAE": "ae",
						"Sharjah, UAE": "ae",
						Uzbekistan: "uz",
						Wales: "gb-wls",
					};

					let state = { cycleFilter: "all", selectedId: null, search: "", layoutMode: "alpha" };
					const participantModal = document.getElementById("participant-modal");
					const participantListEl = document.getElementById("participant-list");
					const participantModalSubtitle = document.getElementById("participant-modal-subtitle");

					function escapeHtml(value) {
						return String(value ?? "").replace(/[&<>"']/g, (char) => {
							return {
								"&": "&amp;",
								"<": "&lt;",
								">": "&gt;",
								'"': "&quot;",
								"'": "&#39;",
							}[char];
						});
					}

					function filteredData() {
						let list = state.cycleFilter === "all" ? DATA : DATA.filter((d) => d.cycles.includes(state.cycleFilter));
						if (state.search.trim()) {
							const q = state.search.trim().toLowerCase();
							list = list.filter((d) => d.name.toLowerCase().includes(q));
						}
						return list;
					}

					function buildParticipantDots(count, maxCount) {
						return Array.from(
							{ length: maxCount },
							(_, i) => '<span class="' + (i < count ? "on" : "") + '"></span>',
						).join("");
					}

					function renderParticipantList() {
						const list = [...filteredData()].sort((a, b) => a.name.localeCompare(b.name));
						const maxCycles = d3.max(DATA, (d) => d.cycleCount) || 1;
						const filterLabel = state.cycleFilter === "all" ? "All cycles" : state.cycleFilter;

						if (!list.length) {
							participantListEl.innerHTML =
								'<div class="participant-empty">No countries match the current filter.</div>';
							return;
						}

						const CYCLE_YEAR = {
							P01: "2001",
							P06: "2006",
							P11: "2011",
							P16: "2016",
							P21: "2021",
						};
						participantListEl.innerHTML = list
							.map((d) => {
								const languagesText = d.languages.length ? d.languages.join(", ") : "No languages listed";
								const yearsText = d.cycles.length ? d.cycles.map((c) => CYCLE_YEAR[c] || c).join(", ") : "None";
								return `
									<div class="participant-item">
										<div class="participant-name"><a href="https:" target="_blank" rel="noreferrer">${escapeHtml(d.name)}</a></div>
										<div class="participant-section">
											<div class="participant-label">Prior PIRLS Participations</div>
											<div class="participant-meta">
												<span class="participant-dots" aria-hidden="true">${buildParticipantDots(d.cycleCount, maxCycles)}</span>
											</div>
											<div class="participant-years">${escapeHtml(yearsText)}</div>
										</div>
										<div class="participant-section">
											<div class="participant-label">PIRLS 2026 Assessment Languages</div>
											<div class="participant-languages">${d.langCount} language${d.langCount === 1 ? "" : "s"}: ${escapeHtml(languagesText)}</div>
										</div>
									</div>
								`;
							})
							.join("");
					}

					function openParticipantModal() {
						renderParticipantList();
						participantModal.classList.add("open");
						participantModal.setAttribute("aria-hidden", "false");
					}

					function closeParticipantModal() {
						participantModal.classList.remove("open");
						participantModal.setAttribute("aria-hidden", "true");
					}

					function orderedTarget(i, w, h, total) {
						const cols = Math.max(4, Math.floor((w - 80) / 150));
						const rows = Math.max(1, Math.ceil(total / cols));
						const xGap = Math.max(110, Math.min(170, (w - 80) / cols));
						const yGap = Math.max(90, Math.min(135, (h - 80) / rows));
						const col = i % cols;
						const row = Math.floor(i / cols);
						return {
							x: 40 + xGap / 2 + col * xGap,
							y: 40 + yGap / 2 + row * yGap,
						};
					}

					const LANGUAGE_COLORS = ["#fdf2f1", "#f9e4e1", "#f2d0cb", "#eab8b0", "#d99689", "#c76552", "#b83726"];

					function fillFor(d) {
						const count = Math.max(0, d.cycleCount || 0);
						return LANGUAGE_COLORS[Math.min(count, LANGUAGE_COLORS.length - 1)];
					}

					const SHAPES = ["card", "circle"];
					function shapeFor(d) {
						const n = d.langCount || 0;
						if (n === 1) return "circle";
						return "card";
					}
					function nodeRadius(d) {
						const r = 28 + d.cycleCount * 1;
						return Math.max(r, 36);
					}
					function cardSize(d) {
						const base = 24;
						return { w: Math.max(95, 70) + base, h: base * 2.2 };
					}

					function splitLabel(text, maxCharsPerLine, maxLines) {
						const words = String(text || "")
							.split(/\s+/)
							.filter(Boolean);
						const lines = [];
						let current = "";

						words.forEach((word) => {
							const next = current ? current + " " + word : word;
							if (!current || next.length <= maxCharsPerLine) {
								current = next;
								return;
							}
							lines.push(current);
							current = word;
						});

						if (current) lines.push(current);
						if (!lines.length) lines.push(String(text || ""));
						return lines.slice(0, maxLines);
					}

					function drawNodeLabel(group, text, options) {
						const lines = splitLabel(text, options.maxCharsPerLine, options.maxLines);
						const textEl = group
							.append("text")
							.attr("text-anchor", "middle")
							.attr("dominant-baseline", "central")
							.style("font-size", options.fontSize + "px")
							.style("fill", "#0d0d0d")
							.style("font-weight", 700);

						const startY = -((lines.length - 1) * options.lineHeight) / 2;
						lines.forEach((line, i) => {
							textEl
								.append("tspan")
								.attr("x", 0)
								.attr("dy", i === 0 ? startY + "em" : options.lineHeight + "em")
								.text(line);
						});
					}

					let sim = null;

					const LIST_CYCLE_YEAR = { P01: "2001", P06: "2006", P11: "2011", P16: "2016", P21: "2021" };
					const LIST_FILLS   = ["#fdf2f1","#f9e4e1","#f2d0cb","#eab8b0","#d99689","#c76552","#b83726"];
					const LIST_BORDERS = ["rgba(184,55,38,0.2)","rgba(184,55,38,0.35)","rgba(184,55,38,0.5)","#c89088","#b07060","#9a5040","#b83726"];

					function renderListView() {
						const listEl = document.getElementById("list-view");
						const list = filteredData().sort((a, b) => a.name.localeCompare(b.name));
						const maxCycles = d3.max(DATA, (d) => d.cycleCount) || 1;

						if (!list.length) {
							listEl.innerHTML = '<div class="alpha-empty">No countries match the current filter.</div>';
							return;
						}

						const groups = {};
						list.forEach((d) => {
							const letter = d.name[0].toUpperCase();
							if (!groups[letter]) groups[letter] = [];
							groups[letter].push(d);
						});

						listEl.innerHTML = Object.keys(groups).sort().map((letter) => {
							const rows = groups[letter].map((d) =>
								`<div class="alpha-row"><a class="alpha-name" href="#">${escapeHtml(d.name)}</a></div>`
							).join("");
							return `<div class="alpha-section"><div class="alpha-letter">${letter}</div>${rows}</div>`;
						}).join("");
					}

					function runViz() {
						const vizWrap = document.getElementById("viz-wrap");
						const listEl = document.getElementById("list-view");
						if (state.layoutMode === "alpha") {
							if (sim) { sim.stop(); sim = null; }
							document.getElementById("tooltip").classList.remove("visible", "selected");
							document.getElementById("legend").style.display = "none";
							vizWrap.style.display = "none";
							listEl.style.display = "block";
							renderListView();
							return;
						}
						document.getElementById("legend").style.display = "";
						vizWrap.style.display = "";
						listEl.style.display = "none";

						const el = document.getElementById("viz");
						const w = Math.max(el.clientWidth || 800, 400);
						const h = Math.max(el.clientHeight || 500, 300);
						const list = filteredData();

						const nodes = list.map((d) => {
							const shape = shapeFor(d);
							const r = nodeRadius(d);
							const cs = cardSize(d);
							return {
								...d,
								shape,
								radius: shape === "card" ? Math.max(cs.w, cs.h) / 2 + 1 : r + 1,
								cardW: cs.w,
								cardH: cs.h,
								radiusCircle: r,
								x: w / 2 + (Math.random() - 0.5) * w * 0.5,
								y: h / 2 + (Math.random() - 0.5) * h * 0.5,
							};
						});

						d3.select("#viz").selectAll("*").remove();
						const svg = d3.select("#viz").append("svg").attr("width", w).attr("height", h);
						svg.append("rect").attr("class", "viz-bg").attr("width", w).attr("height", h).attr("fill", "transparent");

						const g = svg
							.selectAll("g.node")
							.data(nodes)
							.join("g")
							.attr("class", "node")
							.attr("transform", (d) => "translate(" + d.x + "," + d.y + ")");

						g.each(function (d) {
							const sel = d3.select(this);
							const g2 = sel.append("g").attr("class", "card");
							if (d.shape === "circle") {
								g2.append("circle")
									.attr("r", d.radiusCircle)
									.attr("fill", fillFor(d))
									.attr("stroke", "rgba(184,55,38,0.2)")
									.attr("stroke-width", 1);
								drawNodeLabel(g2, d.name, { fontSize: 12, maxCharsPerLine: 9, maxLines: 3, lineHeight: 1.05 });
							} else {
								const w2 = d.cardW / 2;
								const h2 = d.cardH / 2;
								g2.append("rect")
									.attr("x", -w2)
									.attr("y", -h2)
									.attr("width", d.cardW)
									.attr("height", d.cardH)
									.attr("rx", 8)
									.attr("ry", 8)
									.attr("fill", fillFor(d))
									.attr("stroke", "rgba(184,55,38,0.2)")
									.attr("stroke-width", 1);
								drawNodeLabel(g2, d.name, { fontSize: 12, maxCharsPerLine: 16, maxLines: 2, lineHeight: 1.05 });
							}
						});

						const tooltip = document.getElementById("tooltip");
						const ttName = tooltip.querySelector(".name");
						const ttCycles = tooltip.querySelector(".cycles");
						const ttLanguages = tooltip.querySelector(".languages");

						const TOOLTIP_CYCLE_YEAR = {
							P01: "2001",
							P06: "2006",
							P11: "2011",
							P16: "2016",
							P21: "2021",
						};
						function showTooltip(d, isSelected) {
							ttName.textContent = d.name;
							const yearsLabel = d.cycles.length ? d.cycles.map((c) => TOOLTIP_CYCLE_YEAR[c] || c).join(", ") : "—";
							ttCycles.textContent = "Previous Participation: " + yearsLabel;
							ttLanguages.textContent =
								"PIRLS 2026 Assessment Languages: " +
								(d.languages && d.languages.length ? d.languages.join(", ") : "—");
							const flagEl = tooltip.querySelector(".flag-holder");
							const code = COUNTRY_TO_ISO[d.name];
							flagEl.innerHTML = code ? '<img src="https://flagcdn.com/w160/' + code + '.png" alt="" />' : "";
							tooltip.classList.add("visible");
							tooltip.classList.toggle("selected", !!isSelected);
						}

						g.on("mouseover", function (e, d) {
							showTooltip(d, !!state.selectedId);
						})
							.on("mouseout", () => {
								if (!state.selectedId) tooltip.classList.remove("visible");
								else {
									const sel = DATA.find((r) => r.id === state.selectedId);
									if (sel) showTooltip(sel, true);
								}
							})
							.on("click", (e, d) => {
								e.stopPropagation();
								state.selectedId = state.selectedId === d.id ? null : d.id;
								g.classed("dimmed", (n) => state.selectedId !== null && n.id !== state.selectedId);
								g.classed("selected", (n) => n.id === state.selectedId);
								if (state.selectedId) {
									const sel = DATA.find((r) => r.id === state.selectedId);
									showTooltip(sel, true);
								} else {
									tooltip.classList.remove("visible", "selected");
									g.classed("selected", false);
								}
							});

						const drag = d3
							.drag()
							.on("start", (e, d) => {
								if (!e.active) sim.alphaTarget(0.3).restart();
								d.fx = d.x;
								d.fy = d.y;
							})
							.on("drag", (e, d) => {
								d.fx = e.x;
								d.fy = e.y;
							})
							.on("end", (e, d) => {
								if (!e.active) sim.alphaTarget(0);
								d.fx = null;
								d.fy = null;
							});
						g.call(drag);

						sim = d3
							.forceSimulation(nodes)
							.velocityDecay(0.6)
							.alphaDecay(0.04)
							.force(
								"collide",
								d3
									.forceCollide()
									.radius((d) => d.radius)
									.iterations(2),
							)
							.force("x", d3.forceX(w / 2).strength(0.02))
							.force("y", d3.forceY(h / 2.8).strength(0.1))
							.on("tick", () => {
								g.attr("transform", (d) => {
									const s = d.id === state.selectedId ? 1.2 : 1;
									return "translate(" + d.x + "," + d.y + ")" + (s > 1 ? " scale(" + s + ")" : "");
								});
							});

						svg.on("click", function (e) {
							if (e.target === this || d3.select(e.target).classed("viz-bg")) {
								state.selectedId = null;
								g.classed("dimmed", false);
								g.classed("selected", false);
								tooltip.classList.remove("visible", "selected");
							}
						});
					}

					document.getElementById("cycle-filter").addEventListener("change", (e) => {
						state.cycleFilter = e.target.value;
						state.selectedId = null;
						runViz();
					});

					document.getElementById("search").addEventListener("input", (e) => {
						state.search = e.target.value;
						state.selectedId = null;
						runViz();
					});

					document.getElementById("layout-toggle").addEventListener("click", (e) => {
						state.layoutMode = state.layoutMode === "alpha" ? "cluster" : "alpha";
						e.currentTarget.classList.toggle("on", state.layoutMode === "cluster");
						e.currentTarget.textContent = state.layoutMode === "cluster" ? "Alphabetical List" : "Cluster View";
						runViz();
					});

					document.getElementById("participant-list-toggle").addEventListener("click", () => {
						openParticipantModal();
					});

					participantModal.querySelector(".close-modal").addEventListener("click", () => {
						closeParticipantModal();
					});

					participantModal.addEventListener("click", (e) => {
						if (e.target === participantModal) closeParticipantModal();
					});

					window.addEventListener("keydown", (e) => {
						if (e.key === "Escape") closeParticipantModal();
					});

					window.addEventListener("resize", () => runViz());
					window.addEventListener("load", () => runViz());
				})
				.catch(function (err) {
					console.error("Failed to load CountryInfoforMap.csv:", err);
				});
		</script>
	</body>
